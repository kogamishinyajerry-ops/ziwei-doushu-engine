<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>紫微斗数 · 命盘解读</title>
<style>
  :root{--bg:#060612;--text:#e2dcd0;--dim:#8a8278;--sub:#504a44;--gold:#d4a853;--glow:rgba(212,168,83,0.15);
    --font:"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;--lu:#4ade80;--qu:#f97316;--ke:#60a5fa;--ji:#ef4444}
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{height:100%;overflow:hidden;font-family:var(--font);background:var(--bg);color:var(--text);-webkit-tap-highlight-color:transparent;user-select:none}
  body::after{content:'';position:fixed;inset:-20%;z-index:0;opacity:.4;pointer-events:none;
    background:radial-gradient(ellipse at 30% 20%,rgba(212,168,83,.08) 0%,transparent 50%),
    radial-gradient(ellipse at 70% 50%,rgba(155,126,216,.05) 0%,transparent 50%);
    animation:aurora 15s ease-in-out infinite alternate}
  @keyframes aurora{0%{transform:translate(-3%,-3%) scale(1.05)}100%{transform:translate(3%,3%) scale(.95)}}
  #stars{position:fixed;inset:0;z-index:0;pointer-events:none}
  .deck{height:100%;width:100%;position:relative;overflow:hidden;z-index:1}
  .page{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:36px 14px 100px;transition:transform .65s cubic-bezier(0.22,0.61,0.36,1),opacity .45s;will-change:transform;text-align:center;overflow-y:auto}
  .page.below{transform:translateY(105%);opacity:0;pointer-events:none}
  .page.current{transform:translateY(0);opacity:1}
  .page.above{transform:translateY(-105%);opacity:0;pointer-events:none}
  .crd{background:rgba(14,14,36,.82);border:1px solid rgba(255,255,255,.06);border-radius:24px;padding:28px 22px 24px;width:100%;max-width:330px;position:relative;overflow:hidden;box-shadow:0 16px 48px rgba(0,0,0,.5);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);animation:crdIn .6s cubic-bezier(0.34,1.56,0.64,1)}
  @keyframes crdIn{0%{opacity:0;transform:translateY(36px) scale(.9)}100%{opacity:1;transform:translateY(0) scale(1)}}
  .crd.glow{border-color:var(--gold);box-shadow:0 0 56px var(--glow),0 16px 48px rgba(0,0,0,.5)}
  .crd::before{content:'';position:absolute;top:0;left:50%;transform:translateX(-50%);width:70%;height:1px;background:linear-gradient(90deg,transparent,rgba(255,255,255,.1),transparent)}
  .crd-title{font-size:.62em;color:var(--dim);letter-spacing:.16em;margin-bottom:14px;text-align:center}
  .crd-body{font-size:.72em;line-height:1.75;color:var(--text)}
  .crd-hint{font-size:.58em;color:var(--sub);margin-top:8px;line-height:1.5}
  .crd-icon{font-size:2.4em;margin:6px 0;animation:float 3s ease-in-out infinite}
  @keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-12px)}}

  /* 稀有度hero */
  .hero-card{background:linear-gradient(180deg,rgba(20,15,35,.9),rgba(14,14,36,.85))!important;padding:34px 24px 30px!important}
  .rar-tier{font-size:3em;font-weight:200;letter-spacing:.06em;text-shadow:0 0 40px var(--glow)}
  .rar-badge{display:inline-block;padding:7px 22px;border-radius:22px;font-size:.68em;font-weight:600;letter-spacing:.12em;border:1px solid;margin-bottom:12px}
  .rar-desc{font-size:.74em;line-height:1.7;max-width:260px;margin:8px auto 0}
  .bonus-row{display:flex;flex-wrap:wrap;gap:4px;justify-content:center;margin-top:8px}
  .bonus-tag{padding:4px 10px;border-radius:10px;font-size:.56em;background:rgba(255,255,255,.03);border:1px solid rgba(255,255,255,.06);color:var(--dim)}

  .code-icon{font-size:3.2em;animation:float 3s ease-in-out infinite}
  .code-name{font-size:1.5em;font-weight:600;letter-spacing:.1em;margin:6px 0}
  .code-quote{font-size:.76em;font-style:italic;color:var(--dim);margin:4px 0 12px}
  .kw-row{display:flex;gap:5px;flex-wrap:wrap;justify-content:center;margin:6px 0}
  .kw{padding:5px 13px;border-radius:14px;font-size:.64em;background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.07)}

  /* 星盘圆图SVG — 保留但优化间距 */
  .wheel-svg{width:300px;height:300px}
  .wp{fill:rgba(14,14,36,.65);stroke:rgba(255,255,255,.025);stroke-width:.6;cursor:pointer;transition:fill .2s}
  .wp.hl{fill:rgba(240,192,64,.04);stroke:rgba(240,192,64,.2);stroke-width:1.4}
  .wp:active{fill:rgba(255,255,255,.03)}
  .wl{font-size:7.5px;fill:var(--text);text-anchor:middle;font-weight:500}
  .wb{font-size:6px;fill:var(--dim);text-anchor:middle}
  .ws{font-size:5.5px;font-weight:500}
  .wc{fill:rgba(0,0,0,.45);stroke:var(--gold);stroke-width:1.5}
  .wct{font-size:7px;fill:var(--text);text-anchor:middle;font-weight:600}

  .pixel-canvas{image-rendering:pixelated;border-radius:20px;box-shadow:0 0 40px var(--glow)}
  .pixel-label{font-size:.85em;font-weight:600;margin-top:10px;letter-spacing:.04em}
  .pixel-sub{font-size:.6em;color:var(--sub);margin-top:2px}

  .tl-item{display:flex;gap:10px;align-items:flex-start;margin-bottom:9px;text-align:left}
  .tl-dot{width:7px;height:7px;min-width:7px;border-radius:50%;background:var(--gold);margin-top:4px;box-shadow:0 0 8px var(--gold)}
  .tl-age{font-size:.78em;font-weight:600;color:var(--gold);min-width:36px}
  .tl-body{font-size:.62em;color:var(--dim);line-height:1.55}.tl-body b{color:var(--text);font-weight:500}

  .share-preview{width:210px;border-radius:18px;padding:24px 16px 16px;position:relative;overflow:hidden}
  .sp-badge{font-size:.56em;letter-spacing:.12em;margin-bottom:8px;position:relative}
  .sp-icon{font-size:1.8em;margin-bottom:2px;position:relative}
  .sp-name{font-size:.95em;font-weight:600;position:relative}
  .sp-foot{font-size:.5em;color:var(--sub);margin-top:10px;text-align:center;position:relative}

  .tag-row{display:flex;gap:5px;flex-wrap:wrap;justify-content:center;margin:5px 0}
  .tag{padding:4px 10px;border-radius:13px;font-size:.62em;font-weight:600}
  .t-lu{background:rgba(74,222,128,.08);color:var(--lu);border:1px solid rgba(74,222,128,.15)}
  .t-qu{background:rgba(249,115,22,.08);color:var(--qu);border:1px solid rgba(249,115,22,.15)}
  .t-ke{background:rgba(96,165,250,.08);color:var(--ke);border:1px solid rgba(96,165,250,.15)}
  .t-ji{background:rgba(239,68,68,.08);color:var(--ji);border:1px solid rgba(239,68,68,.15)}
  .t-good{background:rgba(74,222,128,.06);color:#5bbd72;border:1px solid rgba(74,222,128,.12)}
  .t-warn{background:rgba(239,68,68,.06);color:#e85d5d;border:1px solid rgba(239,68,68,.12)}

  .nav{position:fixed;bottom:0;left:0;right:0;z-index:100;padding:14px 20px 28px;display:flex;justify-content:center;align-items:center;gap:14px;background:linear-gradient(transparent,rgba(6,6,18,.98) 45%)}
  .nav-btn{padding:12px 28px;border-radius:22px;font-size:.8em;font-weight:600;letter-spacing:.04em;border:none;cursor:pointer;transition:all .3s;font-family:var(--font)}
  .nav-btn.pri{background:linear-gradient(135deg,var(--gold),#b8933d);color:#0a0a18;box-shadow:0 4px 20px var(--glow)}
  .nav-btn.pri:active{transform:scale(.94)}
  .nav-btn.sec{background:rgba(255,255,255,.05);color:var(--text);border:1px solid rgba(255,255,255,.08)}
  .nav-dots{display:flex;gap:5px}.nd{width:4px;height:4px;border-radius:50%;background:var(--sub);transition:all .3s}
  .nd.on{background:var(--gold);width:15px;border-radius:3px;box-shadow:0 0 8px var(--gold)}

  .brand{font-size:2.2em;margin-bottom:4px}.brand-sub{font-size:.72em;color:var(--dim);letter-spacing:.12em;margin-bottom:26px}
  .form-mini{display:grid;grid-template-columns:1fr 1fr;gap:8px;width:100%;max-width:300px}
  .fm{display:flex;flex-direction:column;gap:3px;text-align:left}.fm.full{grid-column:1/-1}
  .fm label{font-size:.6em;color:var(--sub)}
  .fm input,.fm select{background:rgba(14,14,36,.85);border:1px solid rgba(255,255,255,.06);color:var(--text);padding:10px;border-radius:8px;font-size:.8em;font-family:var(--font);width:100%}
  .fm input:focus,.fm select:focus{outline:none;border-color:var(--gold)}

  .spinner{width:38px;height:38px;margin:0 auto 18px;border:2px solid rgba(255,255,255,.06);border-top-color:var(--gold);border-radius:50%;animation:spin .8s linear infinite}
  @keyframes spin{to{transform:rotate(360deg)}}
  .load-tip{font-size:.68em;color:var(--dim);animation:pulse 2s ease-in-out infinite}
  @keyframes pulse{0%,100%{opacity:.25}50%{opacity:1}}
  .sfx{position:fixed;inset:0;pointer-events:none;z-index:200}
  .sfx-dot{position:absolute;border-radius:50%;animation:sfxFall 3s ease-out forwards}
  @keyframes sfxFall{0%{opacity:1;transform:translate(0,0) scale(1)}100%{opacity:0;transform:translate(var(--x),var(--y)) scale(0)}}
  .deep-card{background:linear-gradient(135deg,rgba(30,10,0,.55),rgba(10,10,30,.55))!important;border:1px solid rgba(255,215,0,.2)!important}
  .sep{width:40px;height:1px;background:rgba(255,255,255,.04);margin:10px auto}
</style>
</head>
<body>
<canvas id="stars"></canvas>
<div class="deck" id="deck">
<div class="page current" id="p0">
<div class="brand">🔮</div><div class="brand-sub">探索你的专属星盘</div>
<div class="form-mini" onsubmit="return false">
<div class="fm full"><label>姓名</label><input id="name" value="星辰" placeholder="你的名字"></div>
<div class="fm"><label>性别</label><select id="gender"><option value="男">男</option><option value="女">女</option></select></div>
<div class="fm"><label>出生年</label><input id="year" type="number" value="1998" min="1900" max="2100"></div>
<div class="fm"><label>月</label><input id="month" type="number" value="3" min="1" max="12"></div>
<div class="fm"><label>日</label><input id="day" type="number" value="21" min="1" max="31"></div>
<div class="fm"><label>时</label><input id="hour" type="number" value="8" min="0" max="23"></div>
<div class="fm"><label>分</label><input id="min" type="number" value="30" min="0" max="59"></div>
<div class="fm full"><label>出生城市</label><input id="city" value="北京" placeholder="如:北京"></div>
</div></div></div>
<div class="nav" id="nav"><div class="nav-dots" id="navDots"></div><button class="nav-btn pri" id="navBtn" onclick="nextPage()">🔮 开始解读</button></div>
<div class="sfx" id="sfx"></div>

<script>
var cp=0,tp=0,cd=null,ad=null,TIER={UR:'👑',SSR:'🌟',SR:'💎',S:'✨'};
var tips=['🌌 接收星辰信号…','⭐ 紫微定位中…','📊 解析命盘格局…','🎭 寻找你的原型…','✨ 即将为你揭晓…'];

(function(){var c=document.getElementById('stars'),ctx=c.getContext('2d');function rs(){c.width=window.innerWidth;c.height=window.innerHeight}rs();window.addEventListener('resize',rs);var arr=[];for(var i=0;i<80;i++)arr.push({x:Math.random()*c.width,y:Math.random()*c.height,r:Math.random()*1.5+.2,s:Math.random()*.012+.003,p:Math.random()*99});function draw(){ctx.clearRect(0,0,c.width,c.height);for(var i=0;i<arr.length;i++){var a=arr[i];a.p+=a.s;var alpha=.1+.22*Math.abs(Math.sin(a.p));ctx.fillStyle='rgba(220,210,180,'+alpha.toFixed(2)+')';ctx.beginPath();ctx.arc(a.x,a.y,a.r,0,Math.PI*2);ctx.fill()}requestAnimationFrame(draw)}draw()})();

function nextPage(){if(cp===0)loadChart();else if(cp<tp-1)goTo(cp+1)}
function goTo(n){
  var pages=document.querySelectorAll('.page');for(var i=0;i<pages.length;i++){var p=pages[i];p.classList.remove('current','above','below');if(i<n)p.classList.add('above');else if(i===n)p.classList.add('current');else p.classList.add('below')}
  cp=n;updateNav();if(n===1&&ad)spawn(ad.rarity||{})
}
function updateNav(){
  var dots='';for(var i=0;i<tp-1;i++)dots+='<div class="nd'+(i===cp-1?' on':'')+'"></div>';document.getElementById('navDots').innerHTML=dots;
  var b=document.getElementById('navBtn');if(cp===0){b.textContent='🔮 开始解读';b.className='nav-btn pri'}else if(cp===tp-1){b.textContent='🔄 重新解读';b.className='nav-btn sec'}else{b.textContent='继续 →';b.className='nav-btn pri'}
}
var ty=0;document.addEventListener('touchstart',function(e){ty=e.touches[0].clientY},{passive:true});document.addEventListener('touchend',function(e){var d=ty-e.changedTouches[0].clientY;if(Math.abs(d)>50&&cp>0){if(d>0&&cp<tp-1)goTo(cp+1);else if(d<0&&cp>1)goTo(cp-1)}});
async function loadChart(){
  var deck=document.getElementById('deck');document.getElementById('navBtn').disabled=true;var fh=document.getElementById('p0').innerHTML;
  var fv={year:+document.getElementById('year').value,month:+document.getElementById('month').value,day:+document.getElementById('day').value,hour:+document.getElementById('hour').value,minute:+document.getElementById('min').value||0,name:document.getElementById('name').value||'',gender:document.getElementById('gender').value,city:document.getElementById('city').value||''};
  deck.innerHTML='<div class="page current"><div class="spinner"></div><div class="crd-icon" style="font-size:3em">🔮</div><div class="load-tip" id="ltip">正在连接星空…</div></div>';
  var ti=0,ti2=setInterval(function(){var e=document.getElementById('ltip');if(e)e.textContent=tips[ti%tips.length];ti++},900);
  try{var r=await fetch('/api/chart/full?'+new URLSearchParams(fv));if(!r.ok){var e=await r.json();throw new Error(e.detail||'排盘失败')}cd=await r.json();ad=cd.analysis||{};clearInterval(ti2);var th=ad.element_theme||{};if(th.primary){document.documentElement.style.setProperty('--gold',th.primary);document.documentElement.style.setProperty('--glow','0 0 35px '+th.primary+'33')}buildPages(fh);tp=document.querySelectorAll('.page').length;if(tp<2)throw new Error('页面未能生成');goTo(1)}
  catch(e2){clearInterval(ti2);var em=e2.message||'未知错误';deck.innerHTML='<div class="page current"><div class="crd"><div class="crd-icon" style="font-size:2.5em">😔</div><div class="crd-body" style="font-size:1.2em;color:#e85d5d">解读失败</div><div class="crd-hint">'+em+'</div></div><button class="nav-btn pri" style="margin-top:16px" onclick="location.reload()">重试</button></div>';tp=1;cp=0}
  document.getElementById('navBtn').disabled=false;updateNav()
}
function esc(s){return(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;')}

function pg(id,glow,title,body,ec){var cls=(ec||glow||'');return'<div class="page below" id="p'+id+'"><div class="crd '+cls+'" style="border-color:'+(glow=='glow'||glow=='hero-card'?(ad.rarity||{}).color||'#d4a853':'rgba(255,255,255,.06)')+'"><div class="crd-title">✦ '+title+' ✦</div>'+body+'</div></div>'}

function buildPages(fh){
  var h='<div class="page above" id="p0">'+fh+'</div>';var rar=ad.rarity||{},dc=ad.destiny_code||{},dims=ad.dimensions||{},cpX=ad.career_path||{},kas=ad.key_ages||[],pers=ad.personality||{},th=ad.element_theme||{},tc=rar.color||'#d4a853',dp=rar.deep_analysis||{},ul=dp.unlocked||false;
  var bs='',bss=rar.bonuses||[];for(var b=0;b<Math.min(bss.length,4);b++)bs+='<span class="bonus-tag">'+esc(bss[b].desc)+'</span>';
  h+=pg(1,'glow','命盘品级','<div class="crd-icon">'+(TIER[rar.tier]||'✨')+'</div><div class="rar-badge" style="color:'+tc+';border-color:'+tc+'">'+(rar.tier||'?')+' &middot; '+(rar.tier_label||'')+'</div><div class="rar-tier" style="color:'+tc+'">'+((rar.score||90)).toFixed(1)+'</div><div class="rar-desc">'+esc(rar.rank_text||'')+'</div>'+(bs?'<div class="sep"></div><div class="bonus-row">'+bs+'</div>':'')+(ul?'<div class="crd-hint" style="color:#ffd700;margin-top:10px">👑 旷世奇才 · 深度命格已解锁</div>':''),'hero-card');
  h+=pg(2,'glow','你的命码','<div class="code-icon">'+esc(dc.emoji||'✨')+'</div><div class="code-name" style="color:'+tc+'">'+esc(dc.full_name||'天命')+'</div><div class="code-quote">「'+esc(dc.tagline||'')+'」</div><div class="kw-row">'+(dc.keywords||[]).map(function(k){return'<span class="kw">'+esc(k)+'</span>'}).join('')+'</div><div class="sep"></div><div class="crd-hint">'+(th.name||'')+'元素 &middot; '+(th.vibe||'')+' &middot; 命宫'+(cd.ming_palace||'')+'</div>');
  h+=pg(3,'glow','五维雷达',radarSVG(dims)+'<div class="crd-hint">'+Object.values(dims).map(function(d){return'<span style="margin:0 3px">'+d.emoji+' '+d.name+' <b style="color:var(--text)">'+d.score+'</b></span>'}).join('')+'</div>');
  h+=pg(4,'glow','命盘星图',wheelSVG()+'<div class="crd-hint">'+(cd.ming_palace||'')+'坐命 &middot; '+(cd.wuxing_ju||'')+' &middot; '+(cd.zodiac||'')+'</div>');
  var si=cd.sihua||{},st='';for(var k in si){var star=si[k],type=k,descs={化禄:'财富资源之门打开',化权:'掌控执行力提升',化科:'名声专业度彰显',化忌:'此领域需谨慎反思'};st+='<div style="font-size:.64em;margin:2px 0"><span style="color:var(--gold)">'+star+'</span> '+type.slice(1)+' &mdash; '+descs[type]+'</div>'}
  h+=pg(5,'glow','四化之力','<div class="crd-icon" style="font-size:2em">⚡</div>'+sihuaTags(si)+'<div class="sep"></div><div style="text-align:left;width:100%">'+st+'</div>');
  h+=pg(6,'glow','天职方向','<div class="crd-icon" style="font-size:2em">💼</div><div style="font-weight:500;color:'+tc+';margin-bottom:6px;line-height:1.4;font-size:.88em">'+(cpX.industries||['通用型']).slice(0,2).join('<br>')+'</div><div class="crd-body" style="font-size:.62em">'+(cpX.work_style||[]).slice(0,2).join(' &middot; ')+'</div>');
  var tl='';for(var i=0;i<Math.min(kas.length,5);i++){var ka=kas[i];tl+='<div class="tl-item"><div class="tl-dot"></div><div class="tl-age">'+ka.age+'岁</div><div class="tl-body"><b>'+esc(ka.title)+'</b><br>'+esc(ka.event)+'</div></div>'}
  h+=pg(7,'glow','人生节律',tl);
  var b8='<div style="font-size:1.05em;line-height:1.65;margin:4px 0">'+esc(pers.summary||'独一无二的你')+'</div>',hl=ad.highlights||[];if(hl.length){b8+='<div class="tag-row">';for(var i=0;i<Math.min(hl.length,3);i++)b8+='<span class="tag t-good">✨ '+esc(hl[i])+'</span>';b8+='</div>'}var ca=ad.cautions||[];if(ca.length){b8+='<div class="tag-row">';for(var i=0;i<Math.min(ca.length,2);i++)b8+='<span class="tag t-warn">'+esc(ca[i])+'</span>';b8+='</div>'}
  h+=pg(8,'glow','核心特质',b8);
  h+=pg(9,'glow','命格形象','<canvas class="pixel-canvas" id="pixelAvatar" width="320" height="320"></canvas><div class="pixel-label" style="color:'+tc+'">'+esc(dc.full_name||'天命')+'</div><div class="pixel-sub">'+(rar.tier_label||'')+' &middot; '+(th.name||'')+'元素 &middot; 专属命格形象</div>');
  if(ul)h+=pg(10,'glow','👑 旷世奇才 &middot; 深度命格','<div style="font-size:.72em;line-height:1.85;text-align:left;background:linear-gradient(135deg,rgba(30,10,0,.4),rgba(10,10,30,.4));padding:14px;border-radius:14px;border:1px solid rgba(255,215,0,.15)">'+(dp.content||'').replace(/\n/g,'<br>')+'</div>');
  var pi=ul?11:10,bg=th.bg||'linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%)';
  h+=pg(pi,'glow','分享你的星盘','<div class="share-preview" id="sharePrev" style="background:'+bg+';border:1px solid '+tc+'"><div class="sp-badge" style="color:'+tc+'">'+(TIER[rar.tier]||'✨')+' '+rar.tier+' &middot; '+(rar.tier_label||'')+'</div><div class="sp-icon">'+esc(dc.emoji||'✨')+'</div><div class="sp-name" style="color:'+tc+'">'+esc(dc.full_name||'天命')+'</div><div style="font-size:.54em;color:var(--dim);margin:3px 0">「'+esc(dc.tagline||'')+'」</div><div class="sp-foot">🔮 紫微斗数 &middot; 专属命盘</div></div><div style="display:flex;gap:6px;margin-top:8px"><button class="nav-btn pri" onclick="downloadCard()" style="font-size:.64em;padding:8px 14px">📥 保存图片</button><button class="nav-btn sec" onclick="copyShare()" style="font-size:.64em;padding:8px 14px">📋 复制文案</button></div>');

function wheelSVG(){
  var ps=cd.palaces||[];if(!ps.length)return'';var cx=150,cy=150,Ro=144,Rm=110,Ri=62,ms='紫微天机太阳武曲天同廉贞天府太阴贪狼巨门天相天梁七杀破军';
  var s='<svg viewBox="0 0 300 300" class="wheel-svg">';
  // Concentric guide rings
  for(var r=Rm-4;r<=Ro;r+=12)s+='<circle cx="'+cx+'" cy="'+cy+'" r="'+r+'" fill="none" stroke="rgba(255,255,255,0.025)" stroke-width="0.5"/>';
  s+='<circle cx="'+cx+'" cy="'+cy+'" r="'+Rm+'" fill="none" stroke="rgba(255,255,255,0.05)" stroke-width="0.8"/><circle cx="'+cx+'" cy="'+cy+'" r="'+Ri+'" fill="none" stroke="rgba(255,255,255,0.06)" stroke-width="0.8"/>';
  for(var i=0;i<12;i++){var p=ps[i];if(!p)continue;var a0=-Math.PI/2+2*Math.PI*i/12-Math.PI/12,a1=a0+2*Math.PI/12;
    var path=ap(cx,cy,Ro,a0,a1)+'L'+(cx+Rm*Math.cos(a1))+','+(cy+Rm*Math.sin(a1))+' '+ap(cx,cy,Rm,a1,a0,1)+'Z';
    s+='<path d="'+path+'" class="wp'+(p.is_body?' hl':'')+'" onclick="palaceTap('+i+')"/>';
    s+='<line x1="'+cx+'" y1="'+cy+'" x2="'+(cx+Ro*Math.cos(a0))+'" y2="'+(cy+Ro*Math.sin(a0))+'" stroke="rgba(255,255,255,0.03)" stroke-width="0.5"/>';
    var na=a0+Math.PI/12;
    // 宫名在外环
    s+='<text x="'+(cx+(Ro-16)*Math.cos(na))+'" y="'+(cy+(Ro-16)*Math.sin(na)+4)+'" class="wl">'+p.name+'</text>';

      var na2=na+0.25;
      s+='<text x="'+(cx+(Ri+6)*Math.cos(na2))+'" y="'+(cy+(Ri+6)*Math.sin(na2)+2)+'" class="ws" fill="#ffd700">'+sn2+'</text>';
    }
  }

  function ap(cx,cy,r,a1,a2,rev){var x1=cx+r*Math.cos(a1),y1=cy+r*Math.sin(a1),x2=cx+r*Math.cos(a2),y2=cy+r*Math.sin(a2);return'M'+x1+','+y1+' A'+r+','+r+' 0 '+(Math.abs(a2-a1)>Math.PI?1:0)+','+(rev?0:1)+' '+x2+','+y2}
}
