<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>紫微斗数 · 命盘解读</title>
<style>
  :root{--bg:#faf8f5;--card:#fff;--text:#2c2430;--dim:#8a7e78;--sub:#b0a8a0;--gold:#c89640;--glow:rgba(200,150,64,0.25);--font:"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;--lu:#22c55e;--qu:#f97316;--ke:#3b82f6;--ji:#ef4444}
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{height:100%;overflow:hidden;font-family:var(--font);background:var(--bg);color:var(--text);-webkit-tap-highlight-color:transparent;user-select:none}
  body::before{content:'';position:fixed;inset:0;pointer-events:none;z-index:0;background:radial-gradient(ellipse at 20% 10%,rgba(200,150,64,.06) 0%,transparent 50%),radial-gradient(ellipse at 80% 90%,rgba(180,160,220,.05) 0%,transparent 50%)}
  .deck{height:100%;width:100%;position:relative;overflow:hidden;z-index:1}
  .page{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:32px 18px 100px;transition:transform .6s cubic-bezier(0.22,0.61,0.36,1),opacity .4s;text-align:center;overflow-y:auto}
  .page.below{transform:translateY(105%);opacity:0;pointer-events:none}
  .page.current{transform:translateY(0);opacity:1}
  .page.above{transform:translateY(-105%);opacity:0;pointer-events:none}

  /* 卡片 — 明亮优雅 */
  .crd{background:var(--card);border:1px solid rgba(0,0,0,.04);border-radius:22px;padding:28px 24px 24px;width:100%;max-width:330px;position:relative;overflow:hidden;box-shadow:0 2px 20px rgba(0,0,0,.04),0 8px 40px rgba(0,0,0,.03);animation:crdIn .6s cubic-bezier(0.34,1.56,0.64,1)}
  @keyframes crdIn{0%{opacity:0;transform:translateY(36px) scale(.92)}100%{opacity:1;transform:translateY(0) scale(1)}}
  .crd.glow{border-color:var(--gold);box-shadow:0 0 40px var(--glow),0 8px 40px rgba(0,0,0,.05)}
  .crd::after{content:'';position:absolute;top:0;left:20%;right:20%;height:1px;background:linear-gradient(90deg,transparent,rgba(200,150,64,.15),transparent)}
  .crd-title{font-size:.66em;color:var(--dim);letter-spacing:.14em;margin-bottom:14px;text-align:center}
  .crd-body{font-size:.74em;line-height:1.8;color:var(--text)}
  .crd-hint{font-size:.6em;color:var(--sub);margin-top:10px;line-height:1.5}
  .crd-icon{font-size:2.8em;margin:8px 0;animation:float 3s ease-in-out infinite}
  @keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-10px)}}
  .hero-card{padding:36px 24px 30px!important;background:linear-gradient(180deg,#fffdf8,#fff)!important}
  .rar-tier{font-size:3em;font-weight:200;letter-spacing:.08em}
  .rar-badge{display:inline-block;padding:7px 20px;border-radius:20px;font-size:.68em;font-weight:600;letter-spacing:.1em;border:1px solid;margin-bottom:12px}
  .rar-desc{font-size:.76em;line-height:1.7;max-width:260px;margin:10px auto 0;color:var(--dim)}
  .bonus-row{display:flex;flex-wrap:wrap;gap:4px;justify-content:center;margin-top:8px}
  .bonus-tag{padding:5px 12px;border-radius:12px;font-size:.58em;background:rgba(200,150,64,.06);border:1px solid rgba(200,150,64,.12);color:var(--gold)}

  .code-icon{font-size:3.5em;animation:float 3s ease-in-out infinite}
  .code-name{font-size:1.6em;font-weight:600;letter-spacing:.1em;margin:8px 0}
  .code-quote{font-size:.78em;font-style:italic;color:var(--dim);margin:6px 0 14px}
  .kw-row{display:flex;gap:6px;flex-wrap:wrap;justify-content:center;margin:8px 0}
  .kw{padding:6px 14px;border-radius:14px;font-size:.66em;background:rgba(200,150,64,.05);border:1px solid rgba(200,150,64,.1);color:var(--gold)}

  .wheel-svg{width:290px;height:290px}
  .wp{fill:#fdfcf8;stroke:rgba(0,0,0,.04);stroke-width:.7;cursor:pointer;transition:fill .2s}
  .wp.hl{fill:rgba(200,150,64,.06);stroke:rgba(200,150,64,.25);stroke-width:1.5}
  .wp:active{fill:rgba(200,150,64,.1)}
  .wl{font-size:7.5px;fill:var(--text);text-anchor:middle;font-weight:700}
  .wb{font-size:6px;fill:var(--dim);text-anchor:middle}
  .ws{font-size:5.5px;font-weight:600}
  .wc{fill:var(--card);stroke:var(--gold);stroke-width:1.5}
  .wct{font-size:7.5px;fill:var(--text);text-anchor:middle;font-weight:700}

  /* ── 命格形象 — emoji合成 ── */
  .avatar-wrap{position:relative;display:inline-block;padding:20px;border-radius:24px;background:linear-gradient(135deg,rgba(200,150,64,.06),rgba(180,160,220,.04));margin:8px 0}
  .avatar-emoji{font-size:5em;line-height:1;filter:drop-shadow(0 4px 12px rgba(0,0,0,.08))}
  .avatar-sparkle{position:absolute;font-size:1.2em;animation:sparkle 2s ease-in-out infinite}
  @keyframes sparkle{0%,100%{opacity:.4;transform:scale(.8)}50%{opacity:1;transform:scale(1.2)}}
  .avatar-tier-badge{display:inline-block;margin-top:8px;padding:4px 14px;border-radius:14px;font-size:.6em;font-weight:600;letter-spacing:.06em}
  .avatar-name{font-size:.9em;font-weight:600;margin-top:6px;letter-spacing:.04em}
  .avatar-sub{font-size:.6em;color:var(--sub);margin-top:2px}

  .tl-item{display:flex;gap:10px;align-items:flex-start;margin-bottom:10px;text-align:left}
  .tl-dot{width:8px;height:8px;min-width:8px;border-radius:50%;background:var(--gold);margin-top:4px;box-shadow:0 0 8px var(--gold)}
  .tl-age{font-size:.8em;font-weight:600;color:var(--gold);min-width:38px}
  .tl-body{font-size:.64em;color:var(--dim);line-height:1.55}.tl-body b{color:var(--text);font-weight:600}

  .share-preview{width:220px;border-radius:20px;padding:24px 16px 18px;position:relative;overflow:hidden;background:#fff;border:1px solid rgba(0,0,0,.05)}
  .sp-badge{font-size:.58em;letter-spacing:.1em;margin-bottom:10px}
  .sp-icon{font-size:2em;margin-bottom:4px}
  .sp-name{font-size:1em;font-weight:700;margin-bottom:2px}
  .sp-foot{font-size:.52em;color:var(--sub);margin-top:10px;text-align:center}

  .tag-row{display:flex;gap:5px;flex-wrap:wrap;justify-content:center;margin:6px 0}
  .tag{padding:5px 12px;border-radius:14px;font-size:.64em;font-weight:600}
  .t-lu{background:rgba(34,197,94,.06);color:var(--lu);border:1px solid rgba(34,197,94,.1)}
  .t-qu{background:rgba(249,115,22,.06);color:var(--qu);border:1px solid rgba(249,115,22,.1)}
  .t-ke{background:rgba(59,130,246,.06);color:var(--ke);border:1px solid rgba(59,130,246,.1)}
  .t-ji{background:rgba(239,68,68,.06);color:var(--ji);border:1px solid rgba(239,68,68,.1)}
  .t-good{background:rgba(34,197,94,.05);color:#16a34a;border:1px solid rgba(34,197,94,.1)}
  .t-warn{background:rgba(239,68,68,.05);color:#dc2626;border:1px solid rgba(239,68,68,.1)}
  .quality-flags{display:flex;flex-direction:column;gap:6px;margin:10px auto 0;max-width:260px}
  .quality-flag{padding:6px 10px;border-radius:12px;font-size:.58em;line-height:1.45;background:rgba(34,197,94,.05);color:#16a34a;border:1px solid rgba(34,197,94,.12)}
  .quality-flag.warn{background:rgba(200,150,64,.07);color:#a86f18;border-color:rgba(200,150,64,.2)}

  .nav{position:fixed;bottom:0;left:0;right:0;z-index:100;padding:14px 20px 28px;display:flex;justify-content:center;align-items:center;gap:14px;background:linear-gradient(transparent,rgba(250,248,245,.98) 45%)}
  .nav-btn{padding:12px 30px;border-radius:22px;font-size:.82em;font-weight:600;letter-spacing:.04em;border:none;cursor:pointer;transition:all .3s;font-family:var(--font)}
  .nav-btn.pri{background:linear-gradient(135deg,var(--gold),#b88030);color:#fff;box-shadow:0 4px 20px var(--glow)}
  .nav-btn.pri:active{transform:scale(.94)}
  .nav-btn.sec{background:rgba(200,150,64,.06);color:var(--gold);border:1px solid rgba(200,150,64,.2)}
  .nav-dots{display:flex;gap:5px}.nd{width:5px;height:5px;border-radius:50%;background:var(--sub);transition:all .3s}
  .nd.on{background:var(--gold);width:16px;border-radius:3px}

  .brand{font-size:2.4em;margin-bottom:4px}
  .brand-sub{font-size:.74em;color:var(--dim);letter-spacing:.1em;margin-bottom:28px}
  .form-mini{display:grid;grid-template-columns:1fr 1fr;gap:10px;width:100%;max-width:310px}
  .fm{display:flex;flex-direction:column;gap:4px;text-align:left}.fm.full{grid-column:1/-1}
  .fm label{font-size:.62em;color:var(--sub)}
  .fm input,.fm select{background:var(--card);border:1px solid rgba(0,0,0,.08);color:var(--text);padding:11px;border-radius:10px;font-size:.82em;font-family:var(--font);width:100%}
  .fm input:focus,.fm select:focus{outline:none;border-color:var(--gold)}

  .spinner{width:40px;height:40px;margin:0 auto 20px;border:2px solid rgba(200,150,64,.1);border-top-color:var(--gold);border-radius:50%;animation:spin .8s linear infinite}
  @keyframes spin{to{transform:rotate(360deg)}}
  .load-tip{font-size:.7em;color:var(--dim);animation:pulse 2s ease-in-out infinite}
  @keyframes pulse{0%,100%{opacity:.3}50%{opacity:1}}
  .load-bar-wrap{width:180px;height:3px;background:rgba(0,0,0,.04);border-radius:2px;margin:16px auto 0;overflow:hidden}
  .load-bar{height:100%;background:var(--gold);border-radius:2px;transition:width .4s ease;width:0%}
  .load-name{color:var(--gold);font-weight:600}
  .load-phase{animation:fadeUp .5s ease}
  @keyframes fadeUp{0%{opacity:0;transform:translateY(12px)}100%{opacity:1;transform:translateY(0)}}

  .sfx{position:fixed;inset:0;pointer-events:none;z-index:200}
  .sfx-dot{position:absolute;border-radius:50%;animation:sfxFall 3s ease-out forwards;background:var(--gold)}
  @keyframes sfxFall{0%{opacity:1;transform:translate(0,0) scale(1)}100%{opacity:0;transform:translate(var(--x),var(--y)) scale(0)}}
  .deep-card{background:linear-gradient(135deg,#fffdf4,#fff8f0)!important;border:1px solid rgba(200,150,64,.2)!important}
  .sep{width:40px;height:1px;background:rgba(0,0,0,.04);margin:10px auto}
</style>
</head>
<body>
<div class="deck" id="deck">
<div class="page current" id="p0">
<div class="brand">🔮</div><div class="brand-sub">探索你的专属星盘</div>
<div class="form-mini">
<div class="fm full"><label>姓名</label><input id="name" value="星辰" placeholder="你的名字"></div>
<div class="fm"><label>性别</label><select id="gender"><option value="男">男</option><option value="女">女</option></select></div>
<div class="fm"><label>出生年</label><input id="year" type="number" value="1998" min="1900" max="2100"></div>
<div class="fm"><label>月</label><input id="month" type="number" value="3" min="1" max="12"></div>
<div class="fm"><label>日</label><input id="day" type="number" value="21" min="1" max="31"></div>
<div class="fm"><label>时</label><input id="hour" type="number" value="8" min="0" max="23"></div>
<div class="fm"><label>分</label><input id="min" type="number" value="30" min="0" max="59"></div>
<div class="fm full"><label>出生城市</label><input id="city" value="北京" placeholder="如:北京"></div>
</div></div></div>
<div class="nav" id="nav"><div class="nav-dots" id="navDots"></div><button class="nav-btn pri" id="navBtn" onclick="nextPage()">🔮 开始解读</button></div>
<div class="sfx" id="sfx"></div>

<script>
var cp=0,tp=0,cd=null,ad=null,TIER={UR:'👑',SSR:'🌟',SR:'💎',S:'✨'};
var loadPhases=[{msg:'正在连接星空数据库…',pct:15,delay:600},{msg:'定位紫微星坐标…',pct:35,delay:900},{msg:'排布命盘十二宫…',pct:55,delay:800},{msg:'分析星曜格局…',pct:72,delay:700},{msg:'生成专属解读…',pct:88,delay:800},{msg:'即将揭晓！',pct:100,delay:300}];

function nextPage(){if(cp===0)loadChart();else if(cp<tp-1)goTo(cp+1)}
function goTo(n){var pages=document.querySelectorAll('.page');for(var i=0;i<pages.length;i++){var p=pages[i];p.classList.remove('current','above','below');if(i<n)p.classList.add('above');else if(i===n)p.classList.add('current');else p.classList.add('below')}cp=n;updateNav();if(n===1&&ad)spawn(ad.rarity||{})}
function updateNav(){var d='';for(var i=0;i<tp-1;i++)d+='<div class="nd'+(i===cp-1?' on':'')+'"></div>';document.getElementById('navDots').innerHTML=d;var b=document.getElementById('navBtn');if(cp===0){b.textContent='🔮 开始解读';b.className='nav-btn pri'}else if(cp===tp-1){b.textContent='🔄 重新解读';b.className='nav-btn sec'}else{b.textContent='继续 →';b.className='nav-btn pri'}}
var ty=0;document.addEventListener('touchstart',function(e){ty=e.touches[0].clientY},{passive:true});document.addEventListener('touchend',function(e){var d=ty-e.changedTouches[0].clientY;if(Math.abs(d)>50&&cp>0){if(d>0&&cp<tp-1)goTo(cp+1);else if(d<0&&cp>1)goTo(cp-1)}});

function showLoadPhase(i,name){var deck=document.getElementById('deck'),p=loadPhases[i],msg=p.msg;if(name&&i===0)msg='正在为 <span class="load-name">'+name+'</span> 连接星空…';if(name&&i===1)msg='为 <span class="load-name">'+name+'</span> 定位紫微星…';var h='<div class="load-phase"><div class="spinner"></div><div style="font-size:.72em;margin-top:12px">'+msg+'</div><div class="load-bar-wrap"><div class="load-bar" id="loadBar" style="width:0%"></div></div></div>';deck.innerHTML='<div class="page current">'+h+'</div>';setTimeout(function(){var bar=document.getElementById('loadBar');if(bar)bar.style.width=p.pct+'%'},50);return p.delay}

async function loadChart(){
  var deck=document.getElementById('deck');document.getElementById('navBtn').disabled=true;var fh=document.getElementById('p0').innerHTML;
  var fv={year:+document.getElementById('year').value,month:+document.getElementById('month').value,day:+document.getElementById('day').value,hour:+document.getElementById('hour').value,minute:+document.getElementById('min').value||0,name:document.getElementById('name').value||'',gender:document.getElementById('gender').value,city:document.getElementById('city').value||''};
  var name=fv.name||'星辰';
  for(var i=0;i<3;i++){showLoadPhase(i,name);await sleep(loadPhases[i].delay)}
  var fp=fetch('/api/chart/full?'+new URLSearchParams(fv));showLoadPhase(3,name);
  try{var r=await fp;if(!r.ok){var e={};try{e=await r.json()}catch(_e){}throw new Error(apiError(e,r))}cd=await r.json();if(cd.error)throw new Error(cd.error);ad=cd.analysis||{};
    if(ad.rarity&&ad.rarity.score){var j=(Math.random()-.5)*2.5;ad.rarity.score=Math.max(90,Math.min(100,Math.round((ad.rarity.score+j)*10)/10))}
    showLoadPhase(5,name);await sleep(400);
    buildPages(fh);tp=document.querySelectorAll('.page').length;if(tp<2)throw new Error('页面未能生成');goTo(1)}
  catch(e2){var em=e2.message||'未知错误';deck.innerHTML='<div class="page current"><div class="crd"><div class="crd-icon" style="font-size:2.5em">😔</div><div class="crd-body" style="font-size:1.2em;color:#e85d5d">解读失败</div><div class="crd-hint">'+em+'</div></div><button class="nav-btn pri" style="margin-top:16px" onclick="location.reload()">重试</button></div>';tp=1;cp=0}
  document.getElementById('navBtn').disabled=false;updateNav()}
  function sleep(ms){return new Promise(function(r){setTimeout(r,ms)})}
  function esc(s){return(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;')}
  function apiError(data,resp){var d=data&&(data.detail||data.error);if(Array.isArray(d))return d.map(function(x){return x.msg||JSON.stringify(x)}).join('; ');return d||((resp&&resp.status)||'')+' '+((resp&&resp.statusText)||'请求失败')}

function renderQualityFlags(flags){
  if(!flags||typeof flags!=='object'||Array.isArray(flags))return'';
  var rows=[];
  addQualityFlag(rows,'solar_time',flags.solar_time);
  addQualityFlag(rows,'lunar',flags.lunar);
  addQualityFlag(rows,'llm',flags.llm);
  if(!rows.length)return'';
  return'<div class="quality-flags">'+rows.join('')+'</div>'
}

function addQualityFlag(rows,key,flag){
  if(!flag||typeof flag!=='object'||Array.isArray(flag))return;
  var status=String(flag.status||''),labels={solar_time:'真太阳时',lunar:'农历',llm:'AI解读'};
  var detail=flag.message||flag.reason||flag.source||flag.city||'';
  var warnStatuses={unknown_city:1,failed:1,fallback:1,local_fallback:1,unavailable:1};
  var cls='quality-flag'+((flag.fallback||warnStatuses[status])?' warn':'');
  var text=qualityStatusText(key,status);
  if(detail)text+=' · '+detail;
  rows.push('<span class="'+cls+'"><b>'+esc(labels[key]||key)+'</b>: '+esc(text)+'</span>')
}

function qualityStatusText(key,status){
  var m={
    solar_time:{not_requested:'未请求校正',checked:'已校验',corrected:'已校正',unknown_city:'城市未匹配',failed:'校正失败'},
    lunar:{pending:'待计算',ok:'已换算',fallback:'使用回退'},
    llm:{llm_ok:'已返回',local_fallback:'本地回退',unavailable:'不可用'}
  };
  return(m[key]&&m[key][status])||status||'已记录'
}

function pg(id,glow,title,body,ec){return'<div class="page below" id="p'+id+'"><div class="crd '+(ec||glow||'')+'" style="border-color:'+(glow==='glow'||glow==='hero-card'?(ad.rarity||{}).color||'#c89640':'rgba(0,0,0,.04)')+'"><div class="crd-title">✦ '+title+' ✦</div>'+body+'</div></div>'}

function buildPages(fh){
  var h='<div class="page above" id="p0">'+fh+'</div>',rar=ad.rarity||{},dc=ad.destiny_code||{},dims=ad.dimensions||{},cpX=ad.career_path||{},kas=ad.key_ages||[],pers=ad.personality||{},th=ad.element_theme||{},tc=rar.color||'#c89640',dp=rar.deep_analysis||{},ul=dp.unlocked||false;
  var bs='',bss=rar.bonuses||[];for(var b=0;b<Math.min(bss.length,4);b++)bs+='<span class="bonus-tag">'+esc(bss[b].desc)+'</span>';
  h+=pg(1,'glow','命盘品级','<div class="crd-icon">'+(TIER[rar.tier]||'✨')+'</div><div class="rar-badge" style="color:'+tc+';border-color:'+tc+'">'+(rar.tier||'?')+' &middot; '+(rar.tier_label||'')+'</div><div class="rar-tier" style="color:'+tc+'">'+((rar.score||90)).toFixed(1)+'</div><div class="rar-desc">'+esc(rar.rank_text||'')+'</div>'+renderQualityFlags(cd.quality_flags)+(bs?'<div class="sep"></div><div class="bonus-row">'+bs+'</div>':'')+(ul?'<div class="crd-hint" style="color:'+tc+'">👑 旷世奇才 · 深度命格已解锁</div>':''),'hero-card');
  h+=pg(2,'glow','你的命码','<div class="code-icon">'+esc(dc.emoji||'✨')+'</div><div class="code-name" style="color:'+tc+'">'+esc(dc.full_name||'天命')+'</div><div class="code-quote">「'+esc(dc.tagline||'')+'」</div><div class="kw-row">'+(dc.keywords||[]).map(function(k){return'<span class="kw">'+esc(k)+'</span>'}).join('')+'</div><div class="sep"></div><div class="crd-hint">'+(th.name||'')+'元素 &middot; '+(th.vibe||'')+' &middot; 命宫'+(cd.ming_palace||'')+'</div>');
  h+=pg(3,'glow','五维雷达',radarSVG(dims)+'<div class="crd-hint">'+Object.values(dims).map(function(d){return'<span style="margin:0 3px">'+d.emoji+' '+d.name+' <b>'+d.score+'</b></span>'}).join('')+'</div>');
  h+=pg(4,'glow','命盘星图',wheelSVG()+'<div class="crd-hint">'+(cd.ming_palace||'')+'坐命 &middot; '+(cd.wuxing_ju||'')+' &middot; '+(cd.zodiac||'')+'</div>');
  var si=cd.sihua||{},st='';for(var k in si){var star=si[k],type=k,descs={化禄:'财富资源之门打开',化权:'掌控执行力提升',化科:'名声专业度彰显',化忌:'此领域需谨慎反思'};st+='<div style="font-size:.65em;margin:2px 0"><span style="color:var(--gold);font-weight:600">'+star+'</span> '+type.slice(1)+' &mdash; '+descs[type]+'</div>'}
  h+=pg(5,'glow','四化之力','<div class="crd-icon" style="font-size:2.2em">⚡</div>'+sihuaTags(si)+'<div class="sep"></div><div style="text-align:left;width:100%">'+st+'</div>');
  h+=pg(6,'glow','天职方向','<div class="crd-icon" style="font-size:2.2em">💼</div><div style="font-weight:600;color:'+tc+';margin-bottom:6px;line-height:1.5;font-size:.9em">'+(cpX.industries||['通用型']).slice(0,2).join('<br>')+'</div><div class="crd-body" style="font-size:.64em">'+(cpX.work_style||[]).slice(0,2).join(' &middot; ')+'</div>');

function radarSVG(dims){var order=['destiny','fortune','talent','heart','challenge'],names={destiny:'天命',fortune:'机遇',talent:'才华',heart:'情缘',challenge:'课题'},cols=['#a78bfa','#22c55e','#3b82f6','#f472b6','#f97316'],cx=135,cy=125,R=85,s='<svg viewBox="0 0 270 260" style="width:270px;height:260px"><defs><linearGradient id="rgrad" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="var(--gold)" stop-opacity="0.3"/><stop offset="100%" stop-color="var(--gold)" stop-opacity="0.04"/></linearGradient></defs>';for(var l=1;l<=4;l++){var lr=R*l/4,pts='';for(var i=0;i<5;i++){var a=-Math.PI/2+2*Math.PI*i/5;pts+=(cx+lr*Math.cos(a))+','+(cy+lr*Math.sin(a))+' '}s+='<polygon points="'+pts+'" fill="none" stroke="rgba(0,0,0,0.05)" stroke-width="0.5"/>'}for(var i=0;i<5;i++){var a=-Math.PI/2+2*Math.PI*i/5;s+='<line x1="'+cx+'" y1="'+cy+'" x2="'+(cx+R*Math.cos(a))+'" y2="'+(cy+R*Math.sin(a))+'" stroke="rgba(0,0,0,0.06)" stroke-width="0.5"/>'}var dp='';for(var i=0;i<5;i++){var d=dims[order[i]];if(!d){dp+=cx+','+cy+' ';continue}var v=d.score/100,a=-Math.PI/2+2*Math.PI*i/5;dp+=(cx+v*R*Math.cos(a))+','+(cy+v*R*Math.sin(a))+' '}s+='<polygon points="'+dp+'" fill="url(#rgrad)" stroke="var(--gold)" stroke-width="2" stroke-opacity="0.5"/>';for(var i=0;i<5;i++){var d=dims[order[i]];if(!d)continue;var v=d.score/100,a=-Math.PI/2+2*Math.PI*i/5,dx=cx+v*R*Math.cos(a),dy=cy+v*R*Math.sin(a);s+='<circle cx="'+dx+'" cy="'+dy+'" r="4.5" fill="var(--gold)" opacity="0.9"/><circle cx="'+dx+'" cy="'+dy+'" r="8" fill="none" stroke="var(--gold)" stroke-width="1.2" opacity="0.3"/>'}for(var i=0;i<5;i++){var d=dims[order[i]];if(!d)continue;var a=-Math.PI/2+2*Math.PI*i/5,lx=cx+(R+28)*Math.cos(a),ly=cy+(R+28)*Math.sin(a);s+='<text x="'+lx+'" y="'+(ly+4)+'" font-size="9" fill="var(--dim)" text-anchor="middle">'+names[order[i]]+'</text>';var v=d.score/100,sx=cx+(v*R+16)*Math.cos(a),sy=cy+(v*R+16)*Math.sin(a);s+='<text x="'+sx+'" y="'+(sy+2)+'" font-size="8" fill="'+cols[i]+'" text-anchor="middle" font-weight="700">'+d.score+'</text>'}s+='<circle cx="'+cx+'" cy="'+cy+'" r="12" fill="none" stroke="var(--gold)" stroke-width="1" opacity="0.3"/><text x="'+cx+'" y="'+(cy+4)+'" font-size="8" fill="var(--dim)" text-anchor="middle">命</text></svg>';return s}

function wheelSVG(){
  var ps=cd.palaces||[];if(!ps.length)return'';var cx=160,cy=160,Ro=152,Rm=108,Ri=58,ms='紫微天机太阳武曲天同廉贞天府太阴贪狼巨门天相天梁七杀破军';

  s+='<circle cx="'+cx+'" cy="'+cy+'" r="'+Rm+'" fill="none" stroke="rgba(0,0,0,0.06)" stroke-width="0.8"/><circle cx="'+cx+'" cy="'+cy+'" r="'+Ri+'" fill="none" stroke="rgba(0,0,0,0.06)" stroke-width="0.8"/>';
  for(var i=0;i<12;i++){var p=ps[i];if(!p)continue;var a0=-Math.PI/2+2*Math.PI*i/12-Math.PI/12,a1=a0+2*Math.PI/12,path=ap(cx,cy,Ro,a0,a1)+'L'+(cx+Rm*Math.cos(a1))+','+(cy+Rm*Math.sin(a1))+' '+ap(cx,cy,Rm,a1,a0,1)+'Z';s+='<path d="'+path+'" class="wp'+(p.is_body?' hl':'')+'" onclick="palaceTap('+i+')"/>';s+='<line x1="'+cx+'" y1="'+cy+'" x2="'+(cx+Ro*Math.cos(a0))+'" y2="'+(cy+Ro*Math.sin(a0))+'" stroke="rgba(0,0,0,0.03)" stroke-width="0.4"/>';var na=a0+Math.PI/12;s+='<text x="'+(cx+(Ro-20)*Math.cos(na))+'" y="'+(cy+(Ro-20)*Math.sin(na)+4)+'" class="wl">'+p.name+'</text>';s+='<text x="'+(cx+(Rm+8)*Math.cos(na))+'" y="'+(cy+(Rm+8)*Math.sin(na)+3)+'" class="wb">'+p.ganzhi+'</text>';var mains=p.stars.filter(function(s){return ms.indexOf(s)>=0});if(mains.length>0){var sn=mains[0];if(sn.length>2)sn=sn.slice(0,2);s+='<text x="'+(cx+(Ri+10)*Math.cos(na))+'" y="'+(cy+(Ri+10)*Math.sin(na)+2)+'" class="ws" fill="var(--gold)">'+sn+'</text>'}if(mains.length>1){var sn2=mains[1];if(sn2.length>2)sn2=sn2.slice(0,2);var na2=na+0.22;s+='<text x="'+(cx+(Ri+3)*Math.cos(na2))+'" y="'+(cy+(Ri+3)*Math.sin(na2)+2)+'" class="ws" fill="var(--gold)">'+sn2+'</text>'}}s+='<circle cx="'+cx+'" cy="'+cy+'" r="'+Ri+'" class="wc"/><text x="'+cx+'" y="'+(cy-6)+'" class="wct">'+(cd.zodiac||'')+'</text><text x="'+cx+'" y="'+(cy+7)+'" class="wct" style="font-size:6px;fill:var(--dim)">'+(cd.wuxing_ju||'')+'</text></svg>';return s;
  function ap(cx,cy,r,a1,a2,rev){var x1=cx+r*Math.cos(a1),y1=cy+r*Math.sin(a1),x2=cx+r*Math.cos(a2),y2=cy+r*Math.sin(a2);return'M'+x1+','+y1+' A'+r+','+r+' 0 '+(Math.abs(a2-a1)>Math.PI?1:0)+','+(rev?0:1)+' '+x2+','+y2}}
