<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>紫微斗数 · 命盘解读</title>
<style>
  :root{--bg:#060612;--text:#e2dcd0;--dim:#8a8278;--sub:#504a44;--gold:#d4a853;--glow:rgba(212,168,83,0.15);
    --font:"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;--lu:#4ade80;--qu:#f97316;--ke:#60a5fa;--ji:#ef4444}
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{height:100%;overflow:hidden;font-family:var(--font);background:var(--bg);color:var(--text);-webkit-tap-highlight-color:transparent;user-select:none}
  body::after{content:'';position:fixed;inset:-20%;z-index:0;opacity:.4;pointer-events:none;
    background:radial-gradient(ellipse at 30% 20%,rgba(212,168,83,.08) 0%,transparent 50%),
    radial-gradient(ellipse at 70% 50%,rgba(155,126,216,.05) 0%,transparent 50%),
    radial-gradient(ellipse at 50% 80%,rgba(96,165,250,.05) 0%,transparent 50%);
    animation:aurora 15s ease-in-out infinite alternate}
  @keyframes aurora{0%{transform:translate(-3%,-3%) scale(1.05)}100%{transform:translate(3%,3%) scale(.95)}}
  #stars{position:fixed;inset:0;z-index:0;pointer-events:none}
  .deck{height:100%;width:100%;position:relative;overflow:hidden;z-index:1}
  .page{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:36px 14px 100px;transition:transform .65s cubic-bezier(0.22,0.61,0.36,1),opacity .45s;will-change:transform;text-align:center;overflow-y:auto}
  .page.below{transform:translateY(105%);opacity:0;pointer-events:none}
  .page.current{transform:translateY(0);opacity:1}
  .page.above{transform:translateY(-105%);opacity:0;pointer-events:none}
  .crd{background:rgba(14,14,36,.82);border:1px solid rgba(255,255,255,.06);border-radius:24px;padding:28px 22px 24px;width:100%;max-width:320px;position:relative;overflow:hidden;box-shadow:0 16px 48px rgba(0,0,0,.5);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);animation:crdIn .6s cubic-bezier(0.34,1.56,0.64,1)}
  @keyframes crdIn{0%{opacity:0;transform:translateY(36px) scale(.9)}100%{opacity:1;transform:translateY(0) scale(1)}}
  .crd.glow{border-color:var(--gold);box-shadow:0 0 56px var(--glow),0 16px 48px rgba(0,0,0,.5)}
  .crd::before{content:'';position:absolute;top:0;left:50%;transform:translateX(-50%);width:70%;height:1px;background:linear-gradient(90deg,transparent,rgba(255,255,255,.1),transparent)}
  .crd-title{font-size:.62em;color:var(--dim);letter-spacing:.16em;margin-bottom:14px;text-align:center}
  .crd-body{font-size:.72em;line-height:1.75;color:var(--text)}
  .crd-hint{font-size:.58em;color:var(--sub);margin-top:8px;line-height:1.5}
  .crd-icon{font-size:2.4em;margin:6px 0;animation:float 3s ease-in-out infinite}
  @keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-12px)}}

  /* ── Rarity hero card ── */
  .hero-card{background:linear-gradient(180deg,rgba(20,15,35,.9),rgba(14,14,36,.85))!important;padding:32px 22px 28px!important}
  .rar-tier{font-size:3em;font-weight:200;letter-spacing:.06em;text-shadow:0 0 40px var(--glow)}
  .rar-badge{display:inline-block;padding:7px 22px;border-radius:22px;font-size:.68em;font-weight:600;letter-spacing:.12em;border:1px solid;margin-bottom:12px}
  .rar-desc{font-size:.74em;line-height:1.7;max-width:260px;margin:8px auto 0}
  .bonus-row{display:flex;flex-wrap:wrap;gap:4px;justify-content:center;margin-top:8px}
  .bonus-tag{padding:4px 10px;border-radius:10px;font-size:.56em;background:rgba(255,255,255,.03);border:1px solid rgba(255,255,255,.06);color:var(--dim)}

  .code-icon{font-size:3.2em;animation:float 3s ease-in-out infinite}
  .code-name{font-size:1.5em;font-weight:600;letter-spacing:.1em;margin:6px 0}
  .code-quote{font-size:.76em;font-style:italic;color:var(--dim);margin:4px 0 12px}
  .kw-row{display:flex;gap:5px;flex-wrap:wrap;justify-content:center;margin:6px 0}
  .kw{padding:5px 13px;border-radius:14px;font-size:.64em;background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.07)}

  .chart-table{width:100%;max-width:300px;border-collapse:separate;border-spacing:3px}
  .chart-table td{padding:8px 5px;background:rgba(255,255,255,.02);border-radius:8px;text-align:center;border:1px solid rgba(255,255,255,.03);font-size:.58em;line-height:1.5}
  .chart-table .cpn{color:var(--gold);font-weight:700;font-size:.78em;margin-bottom:2px}
  .chart-table .cpb{color:var(--dim);font-size:.62em}
  .chart-table .cps{font-size:.72em;font-weight:500;margin-top:2px}
  .chart-table .ct-body{border-color:rgba(240,192,64,.3)!important;box-shadow:inset 0 0 16px rgba(240,192,64,.05)}
  .st-m{color:#ffd700}.st-j{color:#5b9bd5}.st-s{color:#e85d5d}.st-f{color:#5bbd72}

  .pixel-wrap{position:relative;display:inline-block}
  .pixel-canvas{image-rendering:pixelated;border-radius:20px;box-shadow:0 0 40px var(--glow);display:block}
  .pixel-label{font-size:.85em;font-weight:600;margin-top:10px;letter-spacing:.04em}
  .pixel-sub{font-size:.6em;color:var(--sub);margin-top:2px}

  .tl-item{display:flex;gap:10px;align-items:flex-start;margin-bottom:9px;text-align:left}
  .tl-dot{width:7px;height:7px;min-width:7px;border-radius:50%;background:var(--gold);margin-top:4px;box-shadow:0 0 8px var(--gold)}
  .tl-age{font-size:.78em;font-weight:600;color:var(--gold);min-width:36px}
  .tl-body{font-size:.62em;color:var(--dim);line-height:1.55}.tl-body b{color:var(--text);font-weight:500}

  .share-preview{width:210px;border-radius:18px;padding:24px 16px 16px;position:relative;overflow:hidden}
  .share-preview::before{content:'';position:absolute;inset:0;background:radial-gradient(ellipse at 50% 30%,rgba(255,255,255,.015),transparent 60%)}
  .sp-badge{font-size:.56em;letter-spacing:.12em;margin-bottom:8px;position:relative}
  .sp-icon{font-size:1.8em;margin-bottom:2px;position:relative}
  .sp-name{font-size:.95em;font-weight:600;position:relative}
  .sp-foot{font-size:.5em;color:var(--sub);margin-top:10px;text-align:center;position:relative}

  .tag-row{display:flex;gap:5px;flex-wrap:wrap;justify-content:center;margin:5px 0}
  .tag{padding:4px 10px;border-radius:13px;font-size:.62em;font-weight:600}
  .t-lu{background:rgba(74,222,128,.08);color:var(--lu);border:1px solid rgba(74,222,128,.15)}
  .t-qu{background:rgba(249,115,22,.08);color:var(--qu);border:1px solid rgba(249,115,22,.15)}
  .t-ke{background:rgba(96,165,250,.08);color:var(--ke);border:1px solid rgba(96,165,250,.15)}
  .t-ji{background:rgba(239,68,68,.08);color:var(--ji);border:1px solid rgba(239,68,68,.15)}
  .t-good{background:rgba(74,222,128,.06);color:#5bbd72;border:1px solid rgba(74,222,128,.12)}
  .t-warn{background:rgba(239,68,68,.06);color:#e85d5d;border:1px solid rgba(239,68,68,.12)}

  .nav{position:fixed;bottom:0;left:0;right:0;z-index:100;padding:14px 20px 28px;display:flex;justify-content:center;align-items:center;gap:14px;background:linear-gradient(transparent,rgba(6,6,18,.98) 45%)}
  .nav-btn{padding:12px 28px;border-radius:22px;font-size:.8em;font-weight:600;letter-spacing:.04em;border:none;cursor:pointer;transition:all .3s;font-family:var(--font)}
  .nav-btn.pri{background:linear-gradient(135deg,var(--gold),#b8933d);color:#0a0a18;box-shadow:0 4px 20px var(--glow)}
  .nav-btn.pri:active{transform:scale(.94)}
  .nav-btn.sec{background:rgba(255,255,255,.05);color:var(--text);border:1px solid rgba(255,255,255,.08)}
  .nav-dots{display:flex;gap:5px}
  .nd{width:4px;height:4px;border-radius:50%;background:var(--sub);transition:all .3s}
  .nd.on{background:var(--gold);width:15px;border-radius:3px;box-shadow:0 0 8px var(--gold)}

  .brand{font-size:2.2em;margin-bottom:4px}
  .brand-sub{font-size:.72em;color:var(--dim);letter-spacing:.12em;margin-bottom:26px}
  .form-mini{display:grid;grid-template-columns:1fr 1fr;gap:8px;width:100%;max-width:300px}
  .fm{display:flex;flex-direction:column;gap:3px;text-align:left}
  .fm.full{grid-column:1/-1}
  .fm label{font-size:.6em;color:var(--sub)}
  .fm input,.fm select{background:rgba(14,14,36,.85);border:1px solid rgba(255,255,255,.06);color:var(--text);padding:10px;border-radius:8px;font-size:.8em;font-family:var(--font);width:100%}
  .fm input:focus,.fm select:focus{outline:none;border-color:var(--gold)}

  .spinner{width:38px;height:38px;margin:0 auto 18px;border:2px solid rgba(255,255,255,.06);border-top-color:var(--gold);border-radius:50%;animation:spin .8s linear infinite}
  @keyframes spin{to{transform:rotate(360deg)}}
  .load-tip{font-size:.68em;color:var(--dim);animation:pulse 2s ease-in-out infinite}
  @keyframes pulse{0%,100%{opacity:.25}50%{opacity:1}}

  .sfx{position:fixed;inset:0;pointer-events:none;z-index:200}
  .sfx-dot{position:absolute;border-radius:50%;animation:sfxFall 3s ease-out forwards}
  @keyframes sfxFall{0%{opacity:1;transform:translate(0,0) scale(1)}100%{opacity:0;transform:translate(var(--x),var(--y)) scale(0)}}
  .deep-card{background:linear-gradient(135deg,rgba(30,10,0,.55),rgba(10,10,30,.55))!important;border:1px solid rgba(255,215,0,.2)!important}
  .sep{width:40px;height:1px;background:rgba(255,255,255,.04);margin:10px auto}
</style>
</head>
<body>
<canvas id="stars"></canvas>
<div class="deck" id="deck">
<div class="page current" id="p0">
<div class="brand">🔮</div><div class="brand-sub">探索你的专属星盘</div>
<div class="form-mini" onsubmit="return false">
<div class="fm full"><label>姓名</label><input id="name" value="星辰" placeholder="你的名字"></div>
<div class="fm"><label>性别</label><select id="gender"><option value="男">男</option><option value="女">女</option></select></div>
<div class="fm"><label>出生年</label><input id="year" type="number" value="1998" min="1900" max="2100"></div>
<div class="fm"><label>月</label><input id="month" type="number" value="3" min="1" max="12"></div>
<div class="fm"><label>日</label><input id="day" type="number" value="21" min="1" max="31"></div>
<div class="fm"><label>时(0-23)</label><input id="hour" type="number" value="8" min="0" max="23"></div>
<div class="fm"><label>分</label><input id="min" type="number" value="30" min="0" max="59"></div>
<div class="fm full"><label>出生城市</label><input id="city" value="北京" placeholder="如:北京"></div>
</div></div></div>
<div class="nav" id="nav"><div class="nav-dots" id="navDots"></div><button class="nav-btn pri" id="navBtn" onclick="nextPage()">🔮 开始解读</button></div>
<div class="sfx" id="sfx"></div>

<script>
var cp=0,tp=0,cd=null,ad=null,TIER={UR:'👑',SSR:'🌟',SR:'💎',S:'✨'};
var tips=['🌌 接收星辰信号…','⭐ 紫微定位中…','📊 解析命盘格局…','🎭 寻找你的原型…','✨ 即将为你揭晓…'];

(function(){var c=document.getElementById('stars'),ctx=c.getContext('2d');function rs(){c.width=window.innerWidth;c.height=window.innerHeight}rs();window.addEventListener('resize',rs);var arr=[];for(var i=0;i<80;i++)arr.push({x:Math.random()*c.width,y:Math.random()*c.height,r:Math.random()*1.5+.2,s:Math.random()*.012+.003,p:Math.random()*99});function draw(){ctx.clearRect(0,0,c.width,c.height);for(var i=0;i<arr.length;i++){var a=arr[i];a.p+=a.s;var alpha=.1+.22*Math.abs(Math.sin(a.p));ctx.fillStyle='rgba(220,210,180,'+alpha.toFixed(2)+')';ctx.beginPath();ctx.arc(a.x,a.y,a.r,0,Math.PI*2);ctx.fill()}requestAnimationFrame(draw)}draw()})();

function nextPage(){if(cp===0)loadChart();else if(cp<tp-1)goTo(cp+1)}
function goTo(n){
  var pages=document.querySelectorAll('.page');
  for(var i=0;i<pages.length;i++){var p=pages[i];p.classList.remove('current','above','below');if(i<n)p.classList.add('above');else if(i===n)p.classList.add('current');else p.classList.add('below')}
  cp=n;updateNav();if(n===1&&ad)spawn(ad.rarity||{})
}
function updateNav(){
  var dots='';for(var i=0;i<tp-1;i++)dots+='<div class="nd'+(i===cp-1?' on':'')+'"></div>';
  document.getElementById('navDots').innerHTML=dots;
  var b=document.getElementById('navBtn');
  if(cp===0){b.textContent='🔮 开始解读';b.className='nav-btn pri'}
  else if(cp===tp-1){b.textContent='🔄 重新解读';b.className='nav-btn sec'}
  else{b.textContent='继续 →';b.className='nav-btn pri'}
}
var ty=0;document.addEventListener('touchstart',function(e){ty=e.touches[0].clientY},{passive:true});
document.addEventListener('touchend',function(e){var d=ty-e.changedTouches[0].clientY;if(Math.abs(d)>50&&cp>0){if(d>0&&cp<tp-1)goTo(cp+1);else if(d<0&&cp>1)goTo(cp-1)}});

async function loadChart(){
  var deck=document.getElementById('deck');document.getElementById('navBtn').disabled=true;
  var fh=document.getElementById('p0').innerHTML;
  var fv={year:+document.getElementById('year').value,month:+document.getElementById('month').value,day:+document.getElementById('day').value,hour:+document.getElementById('hour').value,minute:+document.getElementById('min').value||0,name:document.getElementById('name').value||'',gender:document.getElementById('gender').value,city:document.getElementById('city').value||''};
  deck.innerHTML='<div class="page current"><div class="spinner"></div><div class="crd-icon" style="font-size:3em">🔮</div><div class="load-tip" id="ltip">正在连接星空…</div></div>';
  var ti=0,ti2=setInterval(function(){var e=document.getElementById('ltip');if(e)e.textContent=tips[ti%tips.length];ti++},900);
  try{
    var r=await fetch('/api/chart/full?'+new URLSearchParams(fv));
    if(!r.ok){var e=await r.json();throw new Error(e.detail||'排盘失败')}
    cd=await r.json();ad=cd.analysis||{};clearInterval(ti2);
    var th=ad.element_theme||{};if(th.primary){var s=document.documentElement.style;s.setProperty('--gold',th.primary);s.setProperty('--glow','0 0 35px '+th.primary+'33')}
    buildPages(fh);
    tp=document.querySelectorAll('.page').length;
    if(tp<2)throw new Error('页面未能生成');
    goTo(1);
  }catch(e2){clearInterval(ti2);var em=e2.message||'未知错误';console.error('解读失败:',em);
    deck.innerHTML='<div class="page current"><div class="crd"><div class="crd-icon" style="font-size:2.5em">😔</div><div class="crd-body" style="font-size:1.2em;color:#e85d5d">解读失败</div><div class="crd-hint">'+em+'</div></div><button class="nav-btn pri" style="margin-top:16px" onclick="location.reload()">重试</button></div>';
    tp=1;cp=0}
  document.getElementById('navBtn').disabled=false;updateNav()
}

function esc(s){return(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;')}
function escQ(s){return(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/'/g,'&#39;')}

function buildPages(fh){
  var h='<div class="page above" id="p0">'+fh+'</div>';
  var rar=ad.rarity||{},dc=ad.destiny_code||{},dims=ad.dimensions||{},cpX=ad.career_path||{},kas=ad.key_ages||[],pers=ad.personality||{},th=ad.element_theme||{},tc=rar.color||'#d4a853',dp=rar.deep_analysis||{},ul=dp.unlocked||false;

  function pg(id,glow,title,body,extraClass){
    var ec=extraClass||glow||'';
    return'<div class="page below" id="p'+id+'"><div class="crd '+ec+'" style="border-color:'+(glow=='glow'||glow=='hero-card'?tc:'rgba(255,255,255,.06)')+'"><div class="crd-title">✦ '+title+' ✦</div>'+body+'</div></div>';
  }

  // P1: 稀有度 hero card
  var bs='',bss=rar.bonuses||[];for(var b=0;b<Math.min(bss.length,4);b++)bs+='<span class="bonus-tag">'+esc(bss[b].desc)+'</span>';
  var b1='<div class="crd-icon">'+(TIER[rar.tier]||'✨')+'</div>';
  b1+='<div class="rar-badge" style="color:'+tc+';border-color:'+tc+'">'+(rar.tier||'?')+' &middot; '+(rar.tier_label||'')+'</div>';
  b1+='<div class="rar-tier" style="color:'+tc+'">'+((rar.score||90)).toFixed(1)+'</div>';
  b1+='<div class="rar-desc">'+esc(rar.rank_text||'')+'</div>';
  if(bs)b1+='<div class="sep"></div><div class="bonus-row">'+bs+'</div>';
  if(ul)b1+='<div class="crd-hint" style="color:#ffd700;margin-top:10px">👑 旷世奇才 · 深度命格已解锁</div>';
  h+=pg(1,'glow','命盘品级',b1,'hero-card');

  // P2: 命码
  var b2='<div class="code-icon">'+esc(dc.emoji||'✨')+'</div>';
  b2+='<div class="code-name" style="color:'+tc+'">'+esc(dc.full_name||'天命')+'</div>';
  b2+='<div class="code-quote">「'+esc(dc.tagline||'')+'」</div>';
  b2+='<div class="kw-row">'+(dc.keywords||[]).map(function(k){return'<span class="kw">'+esc(k)+'</span>'}).join('')+'</div>';
  b2+='<div class="sep"></div><div class="crd-hint">'+(th.name||'')+'元素 &middot; '+(th.vibe||'')+' &middot; 命宫'+(cd.ming_palace||'')+'</div>';
  h+=pg(2,'glow','你的命码',b2);

  // P3: 雷达 + 描述
  var rd=radarSVG(dims);
  var dsum=Object.values(dims).map(function(d){return'<span style="margin:0 4px">'+d.emoji+' '+d.name+' <b style="color:var(--text)">'+d.score+'</b> '+d.label+'</span>'}).join('');
  h+=pg(3,'glow','五维雷达',rd+'<div class="crd-hint">'+dsum+'</div>');

  // P4: 星盘
  h+=pg(4,'glow','命盘星图',chartTable()+'<div class="crd-hint">'+(cd.ming_palace||'')+'坐命 &middot; '+(cd.wuxing_ju||'')+' &middot; '+(cd.zodiac||'')+'</div>');

  // P5: 四化
  var si=cd.sihua||{},st='';for(var k in si){var star=si[k],type=k;var descs={化禄:'财富与资源之门打开',化权:'掌控力与执行力提升',化科:'名声与专业度得到彰显',化忌:'此领域需谨慎与反思'};st+='<div style="font-size:.64em;margin:2px 0"><span style="color:var(--gold)">'+star+'</span> '+type.slice(1)+' — '+descs[type]+'</div>'}
  h+=pg(5,'glow','四化之力','<div class="crd-icon" style="font-size:2em">⚡</div>'+sihuaTags(si)+'<div class="sep"></div><div style="text-align:left;width:100%">'+st+'</div>');

  // P6: 职业
  h+=pg(6,'glow','天职方向','<div class="crd-icon" style="font-size:2em">💼</div><div style="font-weight:500;color:'+tc+';margin-bottom:6px;line-height:1.4;font-size:.88em">'+(cpX.industries||['通用型']).slice(0,2).join('<br>')+'</div><div class="crd-body" style="font-size:.62em">'+(cpX.work_style||[]).slice(0,2).join(' &middot; ')+'</div>');

  // P7: 人生节律
  var tl='';for(var i=0;i<Math.min(kas.length,5);i++){var ka=kas[i];tl+='<div class="tl-item"><div class="tl-dot"></div><div class="tl-age">'+ka.age+'岁</div><div class="tl-body"><b>'+esc(ka.title)+'</b><br>'+esc(ka.event)+'</div></div>'}
  h+=pg(7,'glow','人生节律',tl);

  // P8: 特质
  var b8='<div style="font-size:1.05em;line-height:1.65;margin:4px 0">'+esc(pers.summary||'独一无二的你')+'</div>';
  var hl=ad.highlights||[];if(hl.length){b8+='<div class="tag-row">';for(var i=0;i<Math.min(hl.length,3);i++)b8+='<span class="tag t-good">✨ '+esc(hl[i])+'</span>';b8+='</div>'}
  var ca=ad.cautions||[];if(ca.length){b8+='<div class="tag-row">';for(var i=0;i<Math.min(ca.length,2);i++)b8+='<span class="tag t-warn">'+esc(ca[i])+'</span>';b8+='</div>'}
  h+=pg(8,'glow','核心特质',b8);

  // P9: 像素命格形象 — 增强
  var b9='<div class="pixel-wrap"><canvas class="pixel-canvas" id="pixelAvatar" width="256" height="256"></canvas></div>';
  b9+='<div class="pixel-label" style="color:'+tc+'">'+esc(dc.full_name||'天命')+'</div>';
  b9+='<div class="pixel-sub">'+(rar.tier_label||'')+' &middot; '+(th.name||'')+'元素 &middot; 专属命格形象</div>';
  h+=pg(9,'glow','命格形象',b9);

  // P10: UR深度

    s+='<circle cx="'+dx+'" cy="'+dy+'" r="4.5" fill="var(--gold)" opacity="0.9"/><circle cx="'+dx+'" cy="'+dy+'" r="8" fill="none" stroke="var(--gold)" stroke-width="1.2" opacity="0.3"/>'}
  for(var i=0;i<5;i++){var d=dims[order[i]];if(!d)continue;var a=-Math.PI/2+2*Math.PI*i/5;
    var lx=cx+(R+28)*Math.cos(a),ly=cy+(R+28)*Math.sin(a);s+='<text x="'+lx+'" y="'+(ly+4)+'" font-size="9" fill="var(--dim)" text-anchor="middle">'+names[order[i]]+'</text>';
    var v=d.score/100,sx=cx+(v*R+16)*Math.cos(a),sy=cy+(v*R+16)*Math.sin(a);s+='<text x="'+sx+'" y="'+(sy+2)+'" font-size="8" fill="'+cols[i]+'" text-anchor="middle" font-weight="700">'+d.score+'</text>'}

function drawPixelAvatar(){
  var canvas=document.getElementById('pixelAvatar');if(!canvas)return;
  var ctx=canvas.getContext('2d'),SZ=32,SC=8;
  canvas.width=SZ*SC;canvas.height=SZ*SC;ctx.imageSmoothingEnabled=false;

  var rar=ad.rarity||{},th=ad.element_theme||{},dc=ad.destiny_code||{};
  var el=th.name||'土',tier=rar.tier||'S';

  var palettes={金:['#f8f0e0','#d4a853','#b8933d','#8a6d2b','#e8d5a0','#fff8e8','#c4944a','#ffd700','#a08040','#f0e0b0'],
    木:['#d8f0d0','#4ade80','#3ab868','#2a7a3a','#a0e8a0','#e0ffe0','#60e090','#3a9060','#208040','#b0e8b0'],
    水:['#d8e8f8','#60a5fa','#3a80d0','#2a4a8a','#a0c8f8','#e8f4ff','#5090e0','#3060b0','#2050a0','#b0d0f0'],
    火:['#f8e0d0','#f97316','#d05020','#8a3010','#f8a060','#fff0e0','#e06030','#c04020','#a02010','#f0c0a0'],
    土:['#f0e8d8','#a78bfa','#7858c0','#4a3080','#c8b8f0','#f0e8ff','#8868d0','#6850a0','#402870','#d8c8f0']};
  var p=palettes[el]||palettes['土'];
  var sk=p[0],hr=p[2],c1=p[1],c2=p[3],ac=p[7],dk=p[8],bgp=p[9];

  function hh(s){var h=0;for(var i=0;i<s.length;i++)h=((h<<5)-h)+s.charCodeAt(i);return Math.abs(h)}
  var h1=hh((dc.full_name||'')+(th.name||''))%1000,h2=hh((cd.ming_palace||'')+(cd.wuxing_ju||''))%1000,h3=hh((cd.four_pillars||{}).year||'')%1000;

  var g=[];for(var i=0;i<SZ;i++){g[i]=[];for(var j=0;j<SZ;j++)g[i][j]=0}
  function R(x,y,w,h,v){for(var i=y;i<y+h;i++)for(var j=x;j<x+w;j++)if(i>=0&&i<SZ&&j>=0&&j<SZ)g[i][j]=v}
  function S(x,y,v){if(x>=0&&x<SZ&&y>=0&&y<SZ)g[y][x]=v}

  // Background glow
  for(var a=0;a<8;a++){var ax=16+Math.cos(a/8*Math.PI*2)*10,ay=16+Math.sin(a/8*Math.PI*2)*10;S(Math.round(ax),Math.round(ay),9)}

  // Hair (rows 0-9)
  R(9,0,14,10,2);
  S(9,6,2);S(8,5,2);S(7,4,2);S(22,6,2);S(23,5,2);S(24,4,2);
  // Bangs
  var bangs=h1%5;
  if(bangs===0){R(10,7,12,3,2)}else if(bangs===1){R(9,7,5,3,2);R(18,7,5,3,2)}else{R(11,7,10,2,2)}
  // Hair sides
  if(h2%3===0){S(7,8,2);S(7,9,2)}else{S(24,8,2);S(24,9,2)}

  // Face (rows 9-16)
  R(10,9,12,8,1);
  // Eyes
  S(12,12,4);S(13,12,4);S(18,12,4);S(19,12,4);
  if(h1%3===0){S(13,11,4);S(18,11,4)} // eyebrows
  // Nose
  S(15,14,4);S(16,14,4);
  // Mouth
  if(h2%3===0){S(14,16,3);S(15,16,3);S(16,16,3);S(17,16,3)}else{S(14,16,4);S(17,16,4)}
  // Cheeks
  if(h3%2===0){S(10,14,8);S(21,14,8)}

  // Neck
  R(13,17,6,2,1);

  // Body/clothing (rows 19-29)
  R(9,19,14,11,5);
  // Collar
  S(15,19,6);S(16,19,6);
  // Belt
  if(h1%2===0){R(14,24,4,1,7);R(14,26,4,1,7)}
  // Decorations
  if(h3%4===0){R(10,22,4,3,8);R(18,22,4,3,8)}else{S(15,22,8);S(16,22,8)}

  // Arms
  R(5,19,4,7,5);R(23,19,4,7,5);

  // Legs
  R(11,30,5,2,3);R(16,30,5,2,3);

  // Feet
  R(10,31,12,1,3);

  // Tier accessories
  if(tier==='UR'){
    // Crown
    R(10,0,12,2,7);S(10,2,7);S(21,2,7);S(15,-1,7);S(16,-1,7);
    // Cape
    R(10,19,2,10,7);R(20,19,2,10,7);
    // Halo
    for(var a=0;a<16;a++){var ax=16+Math.cos(a/16*Math.PI*2)*5,ay=4+Math.sin(a/16*Math.PI*2)*4;S(Math.round(ax),Math.round(ay),7)}
  }else if(tier==='SSR'){
    R(10,0,12,1,7);S(15,-1,7);S(16,-1,7);
  }else if(tier==='SR'){
    S(15,0,7);S(16,0,7);
  }

  // Weapon
  var weaponMap={紫微:'sword',天机:'book',太阳:'staff',武曲:'axe',天同:'flute',廉贞:'wand',天府:'shield',太阴:'crystal',贪狼:'dagger',巨门:'horn',天相:'scroll',天梁:'staff',七杀:'spear',破军:'hammer'};
  var primaryStars=dc.primary_stars||['紫微'],star=primaryStars[0]||'紫微',wp=weaponMap[star]||'sword';
  if(wp==='sword'){R(2,12,3,12,8);S(3,11,7);S(4,11,7)}
  else if(wp==='staff'){R(2,10,3,14,8);S(3,8,7);S(4,8,7)}
  else if(wp==='book'){R(27,13,4,5,8)}
  else if(wp==='axe'){R(1,12,4,4,8);S(2,11,7);S(3,10,7)}
  else if(wp==='shield'){R(26,14,5,5,8)}
  else if(wp==='wand'){R(2,11,2,10,8);S(3,10,7)}
  else if(wp==='spear'){R(28,8,3,18,8);S(27,7,7)}
  else if(wp==='crystal'){R(27,14,3,3,8);S(28,13,7)}
  else if(wp==='hammer'){R(1,11,4,5,8);S(2,10,7)}

  // Render
  for(var y=0;y<SZ;y++){for(var x=0;x<SZ;x++){
    var v=g[y][x],co;if(v===0)continue;
    if(v===1)co=sk;else if(v===2)co=hr;else if(v===3)co=c2;else if(v===4)co=dk;else if(v===5)co=c1;else if(v===6)co=p[4];else if(v===7)co=ac;else if(v===8)co=p[6];else if(v===9)co=bgp;else co=sk;
    ctx.fillStyle=co;ctx.fillRect(x*SC,y*SC,SC,SC);
  }}
}
