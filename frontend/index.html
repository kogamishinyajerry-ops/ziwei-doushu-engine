<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>紫微斗数 · 命盘解读</title>
<style>
  :root {
    --bg:#0a0a18; --card-bg:#111128; --text:#e0d8c8; --dim:#7a7268; --sub:#4a4440;
    --gold:#d4a853; --gold-glow:rgba(212,168,83,0.2);
    --font:"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
    --t:0.5s cubic-bezier(0.4,0,0.2,1);
    --sihua-lu:#4ade80; --sihua-quan:#f97316; --sihua-ke:#60a5fa; --sihua-ji:#ef4444;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{height:100%;overflow:hidden;font-family:var(--font);background:var(--bg);color:var(--text);
    -webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}

  .deck{height:100%;width:100%;position:relative;overflow:hidden}
  .page{
    position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;
    padding:48px 20px 100px;transition:transform .6s cubic-bezier(0.32,0.72,0,1),opacity .5s;
    will-change:transform;text-align:center;overflow-y:auto;
  }
  .page.below{transform:translateY(100%);opacity:0;pointer-events:none}
  .page.current{transform:translateY(0);opacity:1}
  .page.above{transform:translateY(-100%);opacity:0;pointer-events:none}

  /* ── 卡片容器 ── */
  .card{
    background:var(--card-bg);border:1px solid rgba(255,255,255,.06);border-radius:20px;
    padding:24px 20px;width:100%;max-width:300px;position:relative;
    box-shadow:0 8px 32px rgba(0,0,0,.3);
    animation:cardIn .5s cubic-bezier(0.34,1.56,0.64,1);
  }
  @keyframes cardIn{0%{opacity:0;transform:translateY(24px) scale(.95)}100%{opacity:1;transform:translateY(0) scale(1)}}
  .card.glow{border-color:var(--gold);box-shadow:0 0 32px var(--gold-glow),0 8px 32px rgba(0,0,0,.3)}
  .card .card-icon{font-size:2.8em;margin-bottom:8px}
  .card .card-title{font-size:.66em;color:var(--dim);letter-spacing:.1em;margin-bottom:10px}
  .card .card-main{font-size:1.4em;font-weight:300;line-height:1.4;margin-bottom:6px}
  .card .card-sub{font-size:.72em;color:var(--dim);line-height:1.6}

  /* ── 稀有卡 ── */
  .rarity-card{animation:cardIn .5s cubic-bezier(0.34,1.56,0.64,1);text-align:center}
  .rarity-tier{font-size:2.6em;font-weight:200;margin:4px 0}
  .rarity-badge{display:inline-block;padding:5px 16px;border-radius:20px;font-size:.7em;font-weight:600;letter-spacing:.1em;border:1px solid;margin-bottom:8px}
  .rarity-text{font-size:.76em;line-height:1.5;max-width:240px;margin:0 auto}

  /* ── 命码卡 ── */
  .code-card .code-emoji{font-size:3em;margin-bottom:6px}
  .code-card .code-name{font-size:1.3em;font-weight:600;letter-spacing:.08em}
  .code-card .code-quote{font-size:.76em;font-style:italic;margin:6px 0 10px}
  .code-card .kw-row{display:flex;gap:6px;flex-wrap:wrap;justify-content:center;margin:8px 0}
  .code-card .kw{padding:4px 10px;border-radius:12px;font-size:.62em;background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.06)}

  /* ── 雷达卡 ── */
  .radar-svg{width:240px;height:240px}

  /* ── 星盘卡 ── */
  .wheel-svg{width:100%;max-width:300px;height:auto}
  .wheel-palace{fill:var(--card-bg);stroke:rgba(255,255,255,.04);stroke-width:1}
  .wheel-palace.hl{fill:rgba(240,192,64,.06);stroke:rgba(240,192,64,.25);stroke-width:1.5}
  .wheel-ring{fill:none;stroke:rgba(255,255,255,.04);stroke-width:1}
  .wheel-label{font-size:9px;fill:var(--text);text-anchor:middle;font-weight:500}
  .wheel-branch{font-size:7px;fill:var(--dim);text-anchor:middle}
  .wheel-star{font-size:6px;font-weight:500}
  .wheel-center{fill:rgba(0,0,0,.6);stroke:var(--gold);stroke-width:1.5}
  .wheel-ct{font-size:7px;fill:var(--text);text-anchor:middle;font-weight:600}

  /* ── 时间线卡 ── */
  .tl-item{display:flex;gap:10px;align-items:flex-start;margin-bottom:10px;text-align:left}
  .tl-age{font-size:.85em;font-weight:600;color:var(--gold);min-width:40px;flex-shrink:0}
  .tl-text{font-size:.62em;color:var(--dim);line-height:1.5}
  .tl-text strong{color:var(--text);font-weight:500}

  /* ── 分享卡 ── */
  .share-preview{width:220px;border-radius:16px;padding:18px 14px;box-shadow:0 0 40px var(--gold-glow)}

  /* ── 标签 ── */
  .sihua-bar{display:flex;gap:6px;justify-content:center;flex-wrap:wrap;margin:8px 0}
  .sh-tag{padding:4px 10px;border-radius:14px;font-size:.62em;font-weight:600}
  .sh-lu{background:rgba(74,222,128,.1);color:var(--sihua-lu);border:1px solid rgba(74,222,128,.2)}
  .sh-quan{background:rgba(249,115,22,.1);color:var(--sihua-quan);border:1px solid rgba(249,115,22,.2)}
  .sh-ke{background:rgba(96,165,250,.1);color:var(--sihua-ke);border:1px solid rgba(96,165,250,.2)}
  .sh-ji{background:rgba(239,68,68,.1);color:var(--sihua-ji);border:1px solid rgba(239,68,68,.2)}

  /* ── 导航 ── */
  .nav{position:fixed;bottom:0;left:0;right:0;z-index:100;padding:16px 24px 28px;
    display:flex;justify-content:center;gap:12px;
    background:linear-gradient(transparent,rgba(10,10,24,.95) 40%)}
  .nav-btn{padding:12px 28px;border-radius:24px;font-size:.8em;font-weight:600;letter-spacing:.04em;
    border:none;cursor:pointer;transition:all var(--t);font-family:var(--font)}
  .nav-btn.primary{background:linear-gradient(135deg,var(--gold),#b8933d);color:#0a0a18;box-shadow:0 4px 16px var(--gold-glow)}
  .nav-btn.primary:active{transform:scale(.96)}
  .nav-btn.ghost{background:rgba(255,255,255,.06);color:var(--text);border:1px solid rgba(255,255,255,.1)}
  .nav-btn.ghost:active{background:rgba(255,255,255,.12)}
  .dots{display:flex;gap:6px;align-items:center}
  .dot{width:5px;height:5px;border-radius:50%;background:var(--sub);transition:all .3s}
  .dot.active{background:var(--gold);width:16px;border-radius:3px}

  /* ── 表单 ── */
  .brand{font-size:2.2em;margin-bottom:4px}
  .brand-sub{font-size:.72em;color:var(--dim);letter-spacing:.1em;margin-bottom:28px}
  .form-mini{display:grid;grid-template-columns:1fr 1fr;gap:8px;width:100%;max-width:300px}
  .fm{display:flex;flex-direction:column;gap:3px;text-align:left}
  .fm.full{grid-column:1/-1}
  .fm label{font-size:.62em;color:var(--sub)}
  .fm input,.fm select{background:var(--card-bg);border:1px solid rgba(255,255,255,.08);color:var(--text);
    padding:10px;border-radius:8px;font-size:.8em;font-family:var(--font);width:100%}
  .fm input:focus,.fm select:focus{outline:none;border-color:var(--gold)}

  /* ── loading ── */
  .spinner{width:36px;height:36px;margin:0 auto 16px;border:2px solid rgba(255,255,255,.08);border-top-color:var(--gold);
    border-radius:50%;animation:spin .8s linear infinite}
  @keyframes spin{to{transform:rotate(360deg)}}
  .load-tip{font-size:.68em;color:var(--dim);animation:pulse 2s ease-in-out infinite}
  @keyframes pulse{0%,100%{opacity:.4}50%{opacity:1}}

  /* ── 粒子 ── */
  .particles{position:fixed;inset:0;pointer-events:none;z-index:200}
  .pt{position:absolute;border-radius:50%;animation:ptFall 3s ease-out forwards}
  @keyframes ptFall{0%{opacity:1;transform:translate(0,0) scale(1)}100%{opacity:0;transform:translate(var(--dx),var(--dy)) scale(0)}}

  @keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
</style>
</head>
<body>

<div class="deck" id="deck">
  <div class="page current" id="p0">
    <div class="brand">🔮</div>
    <div class="brand-sub">探索你的专属星盘</div>
    <div class="form-mini">
      <div class="fm full"><label>姓名</label><input id="name" placeholder="你的名字"></div>
      <div class="fm"><label>性别</label><select id="gender"><option value="男">男</option><option value="女">女</option></select></div>
      <div class="fm"><label>出生年</label><input id="year" type="number" value="1990" min="1900" max="2100"></div>
      <div class="fm"><label>月</label><input id="month" type="number" value="6" min="1" max="12"></div>
      <div class="fm"><label>日</label><input id="day" type="number" value="15" min="1" max="31"></div>
      <div class="fm"><label>时(0-23)</label><input id="hour" type="number" value="12" min="0" max="23"></div>
      <div class="fm"><label>分</label><input id="min" type="number" value="0" min="0" max="59"></div>
      <div class="fm full"><label>出生城市</label><input id="city" placeholder="如:北京"></div>
    </div>
  </div>
</div>

<div class="nav" id="nav">
  <div class="dots" id="dots"></div>
  <button class="nav-btn primary" id="navBtn" onclick="nextPage()">🔮 开始解读</button>
</div>
<div class="particles" id="particles"></div>

<script>
let currentPage=0,totalPages=0;
let chartData=null,analysisData=null;
const tips=['🌌 接收星辰信号…','⭐ 紫微定位中…','📊 解析命盘格局…','🎭 寻找你的原型…','✨ 即将揭晓…'];

function nextPage(){if(currentPage===0){loadChart();return}if(currentPage<totalPages-1)goTo(currentPage+1)}
function goTo(n){
  document.querySelectorAll('.page').forEach((p,i)=>{
    p.classList.remove('current','above','below');
    if(i<n)p.classList.add('above');else if(i===n)p.classList.add('current');else p.classList.add('below');
  });
  currentPage=n;updateNav();
  if(n===1&&analysisData)spawn(analysisData.rarity||{});
}
function updateNav(){
  const btn=document.getElementById('navBtn'),dots=document.getElementById('dots');
  dots.innerHTML=Array.from({length:totalPages-1},(_,i)=>'<div class="dot'+(i===currentPage-1?' active':'')+'"></div>').join('');
  if(currentPage===0){btn.textContent='🔮 开始解读';btn.className='nav-btn primary'}
  else if(currentPage===totalPages-1){btn.textContent='🔄 重新解读';btn.className='nav-btn ghost'}
  else{btn.textContent='继续 →';btn.className='nav-btn primary'}
}

let touchY=0;
document.addEventListener('touchstart',e=>{touchY=e.touches[0].clientY},{passive:true});
document.addEventListener('touchend',e=>{
  const dy=touchY-e.changedTouches[0].clientY;
  if(Math.abs(dy)>50&&currentPage>0){
    if(dy>0&&currentPage<totalPages-1)goTo(currentPage+1);else if(dy<0&&currentPage>1)goTo(currentPage-1);
  }
});

async function loadChart(){
  const deck=document.getElementById('deck');
  document.getElementById('navBtn').disabled=true;
  const formHTML=document.getElementById('p0').innerHTML;
  const fv={year:+document.getElementById('year').value,month:+document.getElementById('month').value,
    day:+document.getElementById('day').value,hour:+document.getElementById('hour').value,
    minute:+document.getElementById('min').value||0,name:document.getElementById('name').value||'',
    gender:document.getElementById('gender').value,city:document.getElementById('city').value||''};

  deck.innerHTML='<div class="page current"><div class="spinner"></div><div class="card-icon" style="font-size:3em">🔮</div><div class="load-tip" id="ltip">正在连接星空…</div></div>';
  let ti=0;const ti2=setInterval(()=>{const el=document.getElementById('ltip');if(el)el.textContent=tips[ti%tips.length];ti++},900);

  try{
    const r=await fetch('/api/chart/full?'+new URLSearchParams(fv));
    if(!r.ok){const e=await r.json();throw new Error(e.detail||'排盘失败')}
    chartData=await r.json();analysisData=chartData.analysis||{};
    clearInterval(ti2);
    const t=analysisData.element_theme||{};
    if(t.primary){const s=document.documentElement.style;s.setProperty('--gold',t.primary);s.setProperty('--gold-glow','0 0 30px '+t.primary+'44')}
    buildPages(formHTML);
    totalPages=document.querySelectorAll('.page').length;
    goTo(1);
  }catch(e){
    clearInterval(ti2);var em=e.message||'未知错误';
    deck.innerHTML='<div class="page current"><div class="card"><div class="card-icon">😔</div><div class="card-main" style="color:#e85d5d">解读失败</div><div class="card-sub">'+em+'</div></div><button class="nav-btn primary" style="margin-top:16px" onclick="location.reload()">重试</button></div>';
  }
  document.getElementById('navBtn').disabled=false;updateNav();
}

function buildPages(formHTML){
  const deck=document.getElementById('deck');
  let html='<div class="page above" id="p0">'+formHTML+'</div>';
  const rar=analysisData.rarity||{},dc=analysisData.destiny_code||{};
  const dims=analysisData.dimensions||{},cp=analysisData.career_path||{};
  const kas=analysisData.key_ages||[],pers=analysisData.personality||{};
  const theme=analysisData.element_theme||{};
  const T={SSR:'🌟',SR:'💎',R:'✨',SRR:'🌿',UR:'🌱'};
  const tc=rar.color||'#d4a853';

  // P1: 稀有度卡
  html+='<div class="page below" id="p1"><div class="card glow rarity-card" style="border-color:'+tc+'">';
  html+='<div class="card-title">✦ 命盘品级 ✦</div>';
  html+='<div class="rarity-badge" style="color:'+tc+';border-color:'+tc+'">'+(T[rar.tier]||'✨')+' '+rar.tier+' · '+(rar.tier_label||'')+'</div>';
  html+='<div class="rarity-tier" style="color:'+tc+'">'+((rar.score||0)/10).toFixed(0)+'<span style="font-size:.3em;opacity:.5">/100</span></div>';
  html+='<div class="rarity-text">'+(rar.rank_text||'')+'</div></div></div>';

  // P2: 命码卡
  html+='<div class="page below" id="p2"><div class="card glow code-card" style="border-color:'+tc+'">';
  html+='<div class="card-title">✦ 你的命码 ✦</div><div class="code-emoji">'+(dc.emoji||'✨')+'</div>';
  html+='<div class="code-name" style="color:'+tc+'">'+(dc.full_name||'天命')+'</div>';
  html+='<div class="code-quote">「'+(dc.tagline||'')+'」</div>';
  html+='<div class="kw-row">'+(dc.keywords||[]).map(k=>'<span class="kw">'+k+'</span>').join('')+'</div>';
  html+='<div style="font-size:.62em;color:var(--dim);margin-top:6px">'+(theme.name||'')+' · '+(theme.vibe||'')+'</div></div></div>';

  // P3: 雷达卡
  html+='<div class="page below" id="p3"><div class="card glow" style="border-color:'+tc+'">';
  html+='<div class="card-title">✦ 五维雷达 ✦</div>'+renderRadar(dims);
  html+='<div style="font-size:.6em;color:var(--dim);margin-top:6px">'+Object.values(dims).map(function(d){return d.label}).join(' · ')+'</div></div></div>';

  // P4: 星盘卡
  html+='<div class="page below" id="p4"><div class="card glow" style="border-color:'+tc+'">';
  html+='<div class="card-title">✦ 命盘星图 ✦</div>'+renderWheel();
  html+='<div style="font-size:.6em;color:var(--dim);margin-top:4px">'+(chartData.ming_palace||'')+' 坐命 · '+(chartData.wuxing_ju||'')+' · '+(chartData.zodiac||'')+'</div></div></div>';

  // P5: 四化卡
  html+='<div class="page below" id="p5"><div class="card glow" style="border-color:'+tc+'">';
  html+='<div class="card-title">✦ 四化之力 ✦</div>';
  html+='<div style="font-size:2em;margin:6px 0">⚡</div>'+sihuaTags();
  html+='<div class="card-sub" style="font-size:.64em;margin-top:8px">'+(cp.sihua_tips||[]).map(function(t){return '<div style="margin:3px 0">'+t+'</div>'}).join('')+'</div></div></div>';

  // P6: 职业卡
  html+='<div class="page below" id="p6"><div class="card glow" style="border-color:'+tc+'">';
  html+='<div class="card-title">✦ 适合领域 ✦</div><div style="font-size:2em;margin:4px 0">💼</div>';
  html+='<div style="font-size:1em;font-weight:400;color:'+tc+';margin-bottom:4px">'+(cp.industries||['通用型']).slice(0,2).join(' / ')+'</div>';
  html+='<div class="card-sub" style="font-size:.64em">'+(cp.work_style||[]).slice(0,2).join(' · ')+'</div></div></div>';

  // P7: 关键年龄卡
  let tl='';
  for(var i=0;i<Math.min(kas.length,5);i++){var ka=kas[i];
    tl+='<div class="tl-item"><div class="tl-age">'+ka.age+'岁</div><div class="tl-text"><strong>'+ka.title+'</strong><br>'+ka.event+'</div></div>';
  }
  html+='<div class="page below" id="p7"><div class="card glow" style="border-color:'+tc+'">';
  html+='<div class="card-title">✦ 关键节点 ✦</div>'+tl+'</div></div>';

  // P8: 特质卡
  html+='<div class="page below" id="p8"><div class="card glow" style="border-color:'+tc+'">';
  html+='<div class="card-title">✦ 核心特质 ✦</div>';
  html+='<div style="font-size:1.1em;line-height:1.6;margin:8px 0">'+(pers.summary||'独一无二的你')+'</div>';
  var hl=analysisData.highlights||[];
  for(var j=0;j<Math.min(hl.length,3);j++){html+='<div class="card-sub" style="margin-top:4px;font-size:.64em">✨ '+hl[j]+'</div>'}
  html+='</div></div>';

  // P9: 分享卡
  var bg=theme.bg||'linear-gradient(135deg, #1a1a2e, #16213e)';
  html+='<div class="page below" id="p9"><div class="card glow" style="border-color:'+tc+'">';
  html+='<div class="card-title">✦ 分享你的星盘 ✦</div>';
  html+='<div class="share-preview" id="sharePrev" style="background:'+bg+';border:1px solid '+tc+';margin:10px auto">';
  html+='<div style="font-size:.58em;letter-spacing:.1em;color:'+tc+';margin-bottom:6px">'+(T[rar.tier]||'✨')+' '+rar.tier+' · '+(rar.tier_label||'')+'</div>';
  html+='<div style="font-size:1.6em;margin-bottom:2px">'+(dc.emoji||'✨')+'</div>';
  html+='<div style="font-size:.9em;font-weight:600;color:'+tc+'">'+(dc.full_name||'天命')+'</div>';
  html+='<div style="font-size:.5em;color:var(--sub);margin-top:8px">🔮 紫微斗数 · 专属命盘</div></div>';
  html+='<div style="display:flex;gap:8px;margin-top:6px"><button class="nav-btn primary" onclick="downloadCard()" style="font-size:.7em;padding:8px 18px">📥 保存卡片</button><button class="nav-btn ghost" onclick="copyShare()" style="font-size:.7em;padding:8px 18px">📋 复制文案</button></div></div></div>';

  deck.innerHTML=html;
}

function sihuaTags(){
  var s=chartData.sihua||{},cls={化禄:'sh-lu',化权:'sh-quan',化科:'sh-ke',化忌:'sh-ji'};
  return '<div class="sihua-bar">'+['化禄','化权','化科','化忌'].filter(function(t){return s[t]}).map(function(t){return '<span class="sh-tag '+cls[t]+'">'+t+': '+s[t]+'</span>'}).join('')+'</div>';
}

// ════════════ 雷达SVG ════════════
function renderRadar(dims){
  var order=['destiny','fortune','talent','heart','challenge'];
  var names={destiny:'天命',fortune:'机遇',talent:'才华',heart:'情缘',challenge:'课题'};
  var cx=130,cy=120,R=85,levels=4;
  var s='<svg class="radar-svg" viewBox="0 0 260 250">';
  s+='<defs><linearGradient id="rg" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="var(--gold)" stop-opacity="0.35"/><stop offset="100%" stop-color="var(--gold)" stop-opacity="0.05"/></linearGradient></defs>';
  for(var l=1;l<=levels;l++){var lr=R*l/levels,pts='';
    for(var i=0;i<5;i++){var a=-Math.PI/2+2*Math.PI*i/5;pts+=(cx+lr*Math.cos(a))+','+(cy+lr*Math.sin(a))+' '}
    s+='<polygon points="'+pts+'" fill="none" stroke="rgba(255,255,255,0.05)" stroke-width="0.5"/>';}
  for(var i=0;i<5;i++){var a=-Math.PI/2+2*Math.PI*i/5;
    s+='<line x1="'+cx+'" y1="'+cy+'" x2="'+(cx+R*Math.cos(a))+'" y2="'+(cy+R*Math.sin(a))+'" stroke="rgba(255,255,255,0.06)" stroke-width="0.5"/>';}
  var dp='';
  for(var i=0;i<5;i++){var k=order[i],d=dims[k];
    if(!d){dp+=cx+','+cy+' ';continue}
    var v=d.score/100,a=-Math.PI/2+2*Math.PI*i/5;dp+=(cx+v*R*Math.cos(a))+','+(cy+v*R*Math.sin(a))+' ';}
  s+='<polygon points="'+dp+'" fill="url(#rg)" stroke="var(--gold)" stroke-width="2" stroke-opacity="0.5"/>';
  for(var i=0;i<5;i++){var k=order[i],d=dims[k];if(!d)continue;
    var v=d.score/100,a=-Math.PI/2+2*Math.PI*i/5;
    var dx=cx+v*R*Math.cos(a),dy=cy+v*R*Math.sin(a);
    s+='<circle cx="'+dx+'" cy="'+dy+'" r="3.5" fill="var(--gold)" opacity="0.9"/>';}
  for(var i=0;i<5;i++){var k=order[i],d=dims[k];if(!d)continue;
    var a=-Math.PI/2+2*Math.PI*i/5,lo=0.28;
    var lx=cx+(R+22)*Math.cos(a),ly=cy+(R+22)*Math.sin(a);
    s+='<text x="'+lx+'" y="'+(ly+3)+'" font-size="8" fill="var(--dim)" text-anchor="middle">'+names[k]+'</text>';
    var sx=cx+(R*d.score/100+16)*Math.cos(a),sy=cy+(R*d.score/100+16)*Math.sin(a);
    s+='<text x="'+sx+'" y="'+(sy+2)+'" font-size="7" fill="var(--text)" text-anchor="middle" font-weight="600">'+d.score+'</text>';}
  s+='</svg>';return s;
}

// ════════════ 星盘SVG ════════════
function renderWheel(){
  var palaces=chartData.palaces||[];if(!palaces.length)return'';
  var cx=150,cy=150,outer=142,inner=55,mid=108;
  var ms='紫微天机太阳武曲天同廉贞天府太阴贪狼巨门天相天梁七杀破军';
  var s='<svg class="wheel-svg" viewBox="0 0 300 300">';
  // rings
  s+='<circle cx="'+cx+'" cy="'+cy+'" r="'+outer+'" class="wheel-ring"/>';
  for(var r=mid-6;r<outer;r+=10)s+='<circle cx="'+cx+'" cy="'+cy+'" r="'+r+'" class="wheel-ring"/>';
  // segments
  for(var i=0;i<12;i++){var p=palaces[i];if(!p)continue;
    var a0=-Math.PI/2+2*Math.PI*i/12-Math.PI/12;
    var a1=a0+2*Math.PI/12;
    var path=ap(cx,cy,outer,a0,a1)+'L'+(cx+mid*Math.cos(a1))+','+(cy+mid*Math.sin(a1))+' '+ap(cx,cy,mid,a1,a0,1)+'Z';
    s+='<path d="'+path+'" class="wheel-palace'+(p.is_body?' hl':'')+'"/>';
    // separator lines
    s+='<line x1="'+cx+'" y1="'+cy+'" x2="'+(cx+outer*Math.cos(a0))+'" y2="'+(cy+outer*Math.sin(a0))+'" stroke="rgba(255,255,255,0.04)" stroke-width="0.5"/>';
    // palace name
    var na=a0+Math.PI/12;
    s+='<text x="'+(cx+(outer-16)*Math.cos(na))+'" y="'+(cy+(outer-16)*Math.sin(na)+3.5)+'" class="wheel-label">'+p.name+'</text>';
    // branch
    s+='<text x="'+(cx+(mid+18)*Math.cos(na))+'" y="'+(cy+(mid+18)*Math.sin(na)+2.5)+'" class="wheel-branch">'+p.ganzhi+'</text>';
    // stars
    var mainS=p.stars.filter(function(s){return ms.indexOf(s)>=0});
    var auxS=p.stars.filter(function(s){return ms.indexOf(s)<0});
    var all=mainS.concat(auxS).slice(0,4);
    for(var j=0;j<all.length;j++){
      var sa=na-0.12+j*0.08,sr=inner+6+j*10;
      var sc=ms.indexOf(all[j])>=0?'#ffd700':(['文昌','文曲','左辅','右弼','天魁','天钺','禄存','天马'].indexOf(all[j])>=0)?'#5b9bd5':'#5bbd72';
      s+='<text x="'+(cx+sr*Math.cos(sa))+'" y="'+(cy+sr*Math.sin(sa)+2)+'" class="wheel-star" fill="'+sc+'">'+all[j]+'</text>';}}
  s+='<circle cx="'+cx+'" cy="'+cy+'" r="'+inner+'" class="wheel-center"/>';
  s+='<text x="'+cx+'" y="'+(cy-7)+'" class="wheel-ct">'+(chartData.zodiac||'')+'</text>';
  s+='<text x="'+cx+'" y="'+(cy+7)+'" class="wheel-ct" style="font-size:5.5px;fill:var(--dim)">'+(chartData.wuxing_ju||'')+'</text>';
  s+='</svg>';return s;

  function ap(cx,cy,r,a1,a2,rev){
    var x1=cx+r*Math.cos(a1),y1=cy+r*Math.sin(a1),x2=cx+r*Math.cos(a2),y2=cy+r*Math.sin(a2);
    return 'M'+x1+','+y1+' A'+r+','+r+' 0 '+(Math.abs(a2-a1)>Math.PI?1:0)+','+(rev?0:1)+' '+x2+','+y2;
  }
}
