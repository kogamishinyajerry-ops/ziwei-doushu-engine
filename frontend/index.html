<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>紫微斗数 · 你的专属命盘</title>
<script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>
<style>
  :root {
    --bg: #0a0a18; --bg2: #111128; --card: #181833; --border: #282850;
    --gold: #d4a853; --gold-dim: rgba(212,168,83,0.12); --gold-glow: rgba(212,168,83,0.25);
    --text: #e8e0d0; --text-dim: #8a8070; --text-sub: #5a5450;
    --sihua-lu: #4ade80; --sihua-quan: #f97316; --sihua-ke: #60a5fa; --sihua-ji: #ef4444;
    --body-glow: #f0c040;
    --font: "PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
    --r:12px; --t:0.3s cubic-bezier(0.4,0,0.2,1);
    --primary: var(--gold); --accent: var(--gold); --card-glow: var(--gold-glow);
    --card-bg-extra: var(--gold-dim);
  }
  *{margin:0;padding:0;box-sizing:border-box}
  html{scroll-behavior:smooth;-webkit-tap-highlight-color:transparent}
  body{
    font-family:var(--font);background:var(--bg);color:var(--text);min-height:100vh;line-height:1.65;
    background-image:radial-gradient(ellipse at 50% -10%,rgba(212,168,83,.04) 0%,transparent 55%),
    radial-gradient(ellipse at 20% 80%,rgba(155,126,216,.03) 0%,transparent 45%),
    radial-gradient(ellipse at 80% 60%,rgba(232,93,93,.02) 0%,transparent 45%);
    overflow-x:hidden;
  }
  .container{max-width:820px;margin:0 auto;padding:14px}

  /* ── Header ── */
  .header{text-align:center;padding:28px 14px 16px}
  .header h1{font-size:1.6em;color:var(--gold);font-weight:300;letter-spacing:.16em}
  .header .sub{color:var(--text-dim);font-size:.76em;margin-top:3px;letter-spacing:.08em}
  .header .sep{width:50px;height:1px;background:var(--gold-dim);margin:10px auto 0}

  /* ── Form ── */
  .form-card{background:var(--card);border:1px solid var(--border);border-radius:var(--r);padding:16px;margin-bottom:18px}
  .form-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(90px,1fr));gap:8px;align-items:end}
  .fg{display:flex;flex-direction:column;gap:2px}
  .fg label{font-size:.66em;color:var(--text-sub);letter-spacing:.05em}
  .fg input,.fg select{background:var(--bg2);border:1px solid var(--border);color:var(--text);padding:8px 9px;border-radius:6px;font-size:.85em;font-family:inherit;width:100%;transition:border var(--t)}
  .fg input:focus,.fg select:focus{outline:none;border-color:var(--gold)}
  .btn{background:linear-gradient(135deg,var(--gold),#b8933d);color:#0a0a18;border:none;padding:10px 22px;border-radius:8px;font-size:.85em;font-weight:600;cursor:pointer;letter-spacing:.05em;white-space:nowrap;transition:all var(--t);box-shadow:0 2px 10px var(--gold-dim)}
  .btn:hover{transform:translateY(-1px);box-shadow:0 4px 18px var(--gold-glow)}
  .btn:disabled{opacity:.4;cursor:not-allowed;transform:none}
  .city-wrap{position:relative}
  .city-suggest{position:absolute;top:100%;left:0;right:0;z-index:10;background:var(--bg2);border:1px solid var(--gold);border-radius:6px;max-height:180px;overflow-y:auto;display:none}
  .city-suggest.show{display:block}
  .city-item{padding:8px 12px;cursor:pointer;font-size:.78em;border-bottom:1px solid var(--border);transition:background var(--t)}
  .city-item:hover{background:var(--gold-dim)}

  /* ── Loading ── */
  .loading-wrap{text-align:center;padding:40px 16px}
  .spinner{width:36px;height:36px;margin:0 auto 14px;border:3px solid var(--border);border-top-color:var(--gold);border-radius:50%;animation:spin .6s linear infinite}
  @keyframes spin{to{transform:rotate(360deg)}}
  .loading-tip{font-size:.72em;color:var(--text-dim);margin-top:8px;animation:fadeInOut 2s ease-in-out infinite}
  @keyframes fadeInOut{0%,100%{opacity:.4}50%{opacity:1}}

  /* ══════════════════════════════════════
     ✨ SBIT-Style 递进式揭秘
     ══════════════════════════════════════ */
  .reveal-step{opacity:0;transform:translateY(24px);transition:opacity .7s ease,transform .7s ease}
  .reveal-step.visible{opacity:1;transform:translateY(0)}

  /* ── 稀有度英雄卡 ── */
  .rarity-hero{
    border-radius:16px;padding:32px 20px;text-align:center;margin-bottom:16px;position:relative;overflow:hidden;
    border:2px solid var(--primary, var(--gold));
    box-shadow:var(--card-glow, 0 0 30px rgba(212,168,83,0.2));
    animation:rarityReveal .8s cubic-bezier(0.34,1.56,0.64,1);
    transition:box-shadow .5s;
  }
  .rarity-hero:hover{box-shadow:var(--card-glow, 0 0 50px rgba(212,168,83,0.4))}
  @keyframes rarityReveal{0%{opacity:0;transform:scale(0.85)}100%{opacity:1;transform:scale(1)}}
  .rarity-hero::before{content:'';position:absolute;inset:0;background:var(--card-bg, radial-gradient(ellipse at 50% 0%,rgba(212,168,83,.08),transparent 70%))}
  .rarity-badge{
    display:inline-flex;align-items:center;gap:6px;padding:6px 20px;border-radius:24px;
    font-size:.78em;font-weight:700;letter-spacing:.12em;margin-bottom:14px;position:relative;
    border:1px solid var(--primary);background:rgba(212,168,83,.08);color:var(--primary);
  }
  .rarity-score{font-size:3.2em;font-weight:200;letter-spacing:.04em;margin:8px 0 4px;position:relative;color:var(--primary)}
  .rarity-score-unit{font-size:.3em;opacity:.7}
  .rarity-rank-text{font-size:.92em;color:var(--text);margin-bottom:4px;position:relative;font-weight:500}
  .rarity-percentile{font-size:.72em;color:var(--text-dim);margin-bottom:10px;position:relative}
  .tier-icons{display:flex;justify-content:center;gap:4px;margin:12px 0}
  .tier-dot{width:12px;height:12px;border-radius:50%;background:var(--border);transition:all .5s}
  .tier-dot.active{background:var(--primary);box-shadow:0 0 10px var(--primary);transform:scale(1.3)}
  .bonus-list{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;margin-top:12px;position:relative}
  .bonus-tag{padding:5px 14px;border-radius:14px;font-size:.66em;background:var(--card-bg-extra);border:1px solid rgba(212,168,83,.15);color:var(--text-dim)}

  /* ── 命码卡 ── */
  .code-hero{
    border-radius:16px;padding:24px 18px;text-align:center;margin-bottom:16px;
    border:1px solid var(--border);position:relative;overflow:hidden;
    background:linear-gradient(135deg, rgba(212,168,83,.04), rgba(155,126,216,.04));
  }
  .code-emoji{font-size:3em;margin-bottom:8px;animation:float 3s ease-in-out infinite}
  @keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
  .code-name{font-size:1.4em;font-weight:700;color:var(--primary);letter-spacing:.08em}
  .code-tagline{font-size:.78em;color:var(--text-dim);margin:6px 0 12px;font-style:italic}
  .code-keywords{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}
  .kw-tag{padding:4px 12px;border-radius:12px;font-size:.7em;background:rgba(212,168,83,.06);color:var(--primary);border:1px solid rgba(212,168,83,.12)}

  /* ── 五维雷达 ── */
  .radar-card{background:var(--card);border:1px solid var(--border);border-radius:var(--r);padding:20px;margin-bottom:16px}
  .radar-title{font-size:.82em;color:var(--text-dim);text-align:center;margin-bottom:16px;letter-spacing:.08em}
  .radar-row{display:flex;align-items:center;gap:10px;margin-bottom:10px}
  .radar-emoji{font-size:1.3em;width:28px;text-align:center}
  .radar-label{font-size:.72em;color:var(--text-dim);width:36px;text-align:right;flex-shrink:0}
  .radar-bar-wrap{flex:1;height:10px;background:var(--bg2);border-radius:5px;overflow:hidden;position:relative}
  .radar-bar{height:100%;border-radius:5px;transition:width 1.4s cubic-bezier(0.34,1.56,0.64,1);position:relative}
  .radar-bar::after{content:'';position:absolute;right:0;top:-4px;width:18px;height:18px;border-radius:50%;background:inherit;opacity:.6;box-shadow:0 0 12px currentColor}
  .radar-score{font-size:.72em;color:var(--text);width:30px;text-align:center;flex-shrink:0;font-weight:600}
  .radar-desc{font-size:.64em;color:var(--text-sub);margin-left:74px;margin-top:-6px;margin-bottom:8px}

  /* ══════════════════════════════════════
     🎆 粒子特效 (SSR专属)
     ══════════════════════════════════════ */
  .particles{position:fixed;inset:0;pointer-events:none;z-index:998}
  .particle{position:absolute;border-radius:50%;animation:particleFall 3s ease-out forwards}
  @keyframes particleFall{
    0%{opacity:1;transform:translate(0,0) scale(1)}
    100%{opacity:0;transform:translate(var(--dx),var(--dy)) scale(0)}
  }

  /* ══════════════════════════════════════
     📸 分享系统
     ══════════════════════════════════════ */
  .share-overlay{
    position:fixed;inset:0;background:rgba(0,0,0,.92);z-index:999;
    display:none;align-items:center;justify-content:center;flex-direction:column;gap:14px;
    backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);
    overflow-y:auto;padding:20px 0;
  }
  .share-overlay.show{display:flex}
  .share-actions-bar{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;z-index:10}
  .sc-btn{padding:10px 18px;border-radius:10px;font-size:.74em;font-weight:600;cursor:pointer;border:none;transition:all var(--t);display:flex;align-items:center;gap:6px}
  .sc-btn.primary{background:linear-gradient(135deg,var(--primary, var(--gold)),#b8933d);color:#0a0a18}
  .sc-btn.secondary{background:rgba(255,255,255,.08);color:var(--text);border:1px solid var(--border)}
  .sc-btn:hover{transform:translateY(-2px)}
  .sc-btn.copied{background:#4ade80!important;color:#0a1a0a!important}
  .share-card-wrap{position:relative;z-index:1}
  .share-card{
    width:340px;border-radius:20px;padding:28px 22px 22px;position:relative;
    box-shadow:0 0 60px rgba(212,168,83,.15);color:var(--text);font-family:var(--font);
    transition:all .3s;
  }
  .share-card-inner{position:relative;z-index:1}
  .sc-header{text-align:center;margin-bottom:16px}
  .sc-badge{display:inline-flex;align-items:center;gap:5px;padding:5px 16px;border-radius:20px;
    font-size:.7em;font-weight:700;letter-spacing:.12em;
    border:1px solid var(--primary);margin-bottom:12px;
    background:rgba(212,168,83,.08);color:var(--primary)}
  .sc-code{font-size:1.3em;font-weight:700;color:var(--primary);letter-spacing:.08em;margin-bottom:2px}
  .sc-emoji{font-size:2.4em;margin-bottom:4px}
  .sc-tagline{font-size:.7em;color:var(--text-dim);font-style:italic;margin-bottom:12px}
  .sc-stats{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin:14px 0}
  .sc-stat{text-align:center;padding:10px 4px;background:rgba(255,255,255,.04);border-radius:12px}
  .sc-stat-val{font-size:.95em;font-weight:700;color:var(--primary)}
  .sc-stat-lbl{font-size:.58em;color:var(--text-sub);margin-top:3px}
  .sc-dims{margin:14px 0}
  .sc-dim-row{display:flex;align-items:center;gap:8px;margin-bottom:6px}
  .sc-dim-emoji{font-size:.95em;width:20px;text-align:center}
  .sc-dim-name{font-size:.62em;color:var(--text-dim);width:30px}
  .sc-dim-bar-wrap{flex:1;height:7px;background:rgba(255,255,255,.08);border-radius:4px;overflow:hidden}
  .sc-dim-bar{height:100%;border-radius:4px}
  .sc-dim-score{font-size:.62em;color:var(--text);width:24px;text-align:right;font-weight:600}
  .sc-footer{text-align:center;padding-top:12px;border-top:1px solid rgba(255,255,255,.08);margin-top:12px}
  .sc-footer span{font-size:.6em;color:var(--text-sub)}
  .sc-watermark{position:absolute;bottom:8px;right:14px;font-size:.48em;color:var(--text-sub);opacity:.5}
  .sc-close{position:absolute;top:14px;right:18px;z-index:10;background:none;border:none;color:var(--text-dim);font-size:1.3em;cursor:pointer}

  /* ── 模板选择器 ── */
  .tmpl-picker{display:flex;gap:6px;justify-content:center;z-index:10}
  .tmpl-dot{width:28px;height:28px;border-radius:50%;border:2px solid transparent;cursor:pointer;transition:all .2s}
  .tmpl-dot.active{border-color:#fff;transform:scale(1.2)}
  .tmpl-dot.t1{background:linear-gradient(135deg,#1a1a2e,#16213e)}
  .tmpl-dot.t2{background:linear-gradient(135deg,#1a0a0a,#2e0d0d)}
  .tmpl-dot.t3{background:linear-gradient(135deg,#0a1a2e,#0d1a3a)}

  /* ── 社交计数 ── */
  .social-proof{text-align:center;margin:10px 0;font-size:.68em;color:var(--text-sub)}
  .social-proof .count{color:var(--primary);font-weight:600}

  /* ── 复制文案区 ── */
  .copy-caption-area{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:12px 14px;
    font-size:.68em;color:var(--text-dim);line-height:1.8;max-width:360px;position:relative;z-index:10}
  .copy-caption-area .copy-hint{position:absolute;top:8px;right:10px;font-size:.8em;cursor:pointer;color:var(--text-sub);transition:color .2s}
  .copy-caption-area .copy-hint:hover{color:var(--primary)}

  /* ══════════════════════════════════════
     🏰 命盘网格
     ══════════════════════════════════════ */
  .info-bar{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:6px;margin-bottom:14px}
  .info-card{background:var(--card);border:1px solid var(--border);border-radius:8px;padding:8px 10px}
  .info-label{font-size:.62em;color:var(--text-sub);letter-spacing:.04em}
  .info-value{font-size:.8em;font-weight:500;margin-top:1px}
  .info-value.hl{color:var(--gold)}
  .sihua-row{display:flex;gap:6px;flex-wrap:wrap;justify-content:center;margin-bottom:14px}
  .si-tag{padding:3px 10px;border-radius:16px;font-size:.7em;font-weight:600}
  .si-lu{background:rgba(74,222,128,.08);color:var(--sihua-lu);border:1px solid rgba(74,222,128,.25)}
  .si-quan{background:rgba(249,115,22,.08);color:var(--sihua-quan);border:1px solid rgba(249,115,22,.25)}
  .si-ke{background:rgba(96,165,250,.08);color:var(--sihua-ke);border:1px solid rgba(96,165,250,.25)}
  .si-ji{background:rgba(239,68,68,.08);color:var(--sihua-ji);border:1px solid rgba(239,68,68,.25)}
  .tabs{display:flex;gap:4px;margin-bottom:14px;overflow-x:auto;scrollbar-width:none}
  .tab{padding:6px 14px;border-radius:18px;font-size:.7em;font-weight:500;cursor:pointer;white-space:nowrap;transition:all var(--t);border:1px solid var(--border);color:var(--text-dim);background:transparent;flex-shrink:0}
  .tab.active{background:var(--gold-dim);border-color:var(--gold);color:var(--gold)}
  .chart-grid{display:grid;grid-template-columns:1fr 1fr 1fr 1fr;gap:4px;margin-bottom:16px}
  .palace{background:var(--card);border:1px solid var(--border);border-radius:6px;padding:7px 5px;min-height:88px;cursor:pointer;position:relative;transition:all var(--t)}
  .palace:hover{border-color:rgba(212,168,83,.35);transform:translateY(-1px)}
  .palace.body-palace{border-color:var(--body-glow);box-shadow:0 0 12px rgba(240,192,64,.06)}
  .palace.selected{border-color:var(--gold)!important;box-shadow:0 0 18px var(--gold-glow)!important;z-index:2}
  .ph{display:flex;justify-content:space-between;align-items:center;margin-bottom:2px;padding-bottom:2px;border-bottom:1px solid var(--gold-dim)}
  .pn{font-size:.7em;font-weight:600;color:var(--gold)}
  .pgz{font-size:.62em;color:var(--text-dim)}
  .ps{display:flex;flex-wrap:wrap;gap:1px;font-size:.64em;line-height:1.35}
  .star{padding:0 3px;border-radius:2px;font-weight:500;white-space:nowrap}
  .st-main{color:#ffd700}.st-sha{color:#e85d5d}.st-ji{color:#5b9bd5}.st-fu{color:#5bbd72}
  .body-dot{position:absolute;top:3px;right:3px;width:5px;height:5px;border-radius:50%;background:var(--body-glow);box-shadow:0 0 5px var(--body-glow)}
  .dx-tag{font-size:.56em;color:var(--text-sub);text-align:right;margin-top:3px}
  .panel{background:var(--card);border:1px solid var(--border);border-radius:var(--r);padding:14px;margin-bottom:14px}
  .panel h3{font-size:.84em;color:var(--gold);margin-bottom:8px;font-weight:500}
  .section-text{font-size:.78em;line-height:1.75;color:var(--text);margin-bottom:8px}
  .highlight-good{font-size:.76em;padding:5px 10px;margin:3px 0;border-radius:5px;background:var(--bg2);color:#5bbd72;border-left:3px solid #5bbd72}
  .highlight-warn{font-size:.76em;padding:5px 10px;margin:3px 0;border-radius:5px;background:var(--bg2);color:#e85d5d;border-left:3px solid #e85d5d}
  .share-bar{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin:16px 0}
  .share-btn{padding:10px 24px;border-radius:24px;font-size:.76em;font-weight:600;cursor:pointer;border:none;transition:all var(--t);display:flex;align-items:center;gap:6px}
  .share-btn.primary-btn{background:linear-gradient(135deg,var(--primary, var(--gold)),#b8933d);color:#0a0a18;box-shadow:0 4px 15px var(--card-glow)}
  .share-btn.primary-btn:hover{transform:translateY(-2px);box-shadow:0 6px 24px var(--card-glow)}
  .share-btn.secondary-btn{background:rgba(255,255,255,.06);color:var(--text);border:1px solid var(--border)}
  .share-btn.secondary-btn:hover{background:rgba(255,255,255,.1)}

  .footer{text-align:center;padding:24px;color:var(--text-sub);font-size:.64em}

  @media(max-width:480px){
    .header h1{font-size:1.3em}.chart-grid{gap:2px}.palace{padding:5px 3px;min-height:72px}.pn{font-size:.6em}.ps{font-size:.58em}.info-bar{grid-template-columns:1fr 1fr}.form-grid{grid-template-columns:1fr 1fr}
    .rarity-score{font-size:2.6em}.share-card{width:92vw;padding:22px 16px 18px}
    .sc-actions-bar{flex-wrap:wrap;justify-content:center}
  }
</style>
</head>
<body>
<div class="container" id="app">

<div class="header"><h1>🔮 紫微斗数</h1><div class="sub">探索你的专属命盘</div><div class="sep"></div></div>

<div class="form-card">
<div class="form-grid">
  <div class="fg"><label>姓名</label><input id="name" placeholder="你的名字"></div>
  <div class="fg"><label>性别</label><select id="gender"><option value="男">男</option><option value="女">女</option></select></div>
  <div class="fg"><label>出生年</label><input id="year" type="number" value="1990" min="1900" max="2100"></div>
  <div class="fg"><label>月</label><input id="month" type="number" value="6" min="1" max="12"></div>
  <div class="fg"><label>日</label><input id="day" type="number" value="15" min="1" max="31"></div>
  <div class="fg"><label>时</label><input id="hour" type="number" value="12" min="0" max="23"></div>
  <div class="fg"><label>分</label><input id="min" type="number" value="0" min="0" max="59"></div>
  <div class="fg city-wrap"><label>出生城市</label><input id="city" placeholder="如:北京" autocomplete="off" oninput="searchCity()" onfocus="this.select()"><div class="city-suggest" id="cityList"></div></div>
  <div class="fg" style="justify-content:flex-end"><button class="btn" id="go" onclick="loadChart()">🔮 深度解读</button></div>
</div>
</div>

<div id="out"></div>
<div class="footer">紫微斗数 · 仅供研究参考</div>
</div>

<!-- 分享浮层 -->
<div class="share-overlay" id="shareOverlay">
  <div class="tmpl-picker" id="tmplPicker">
    <div class="tmpl-dot t1 active" onclick="switchTemplate(0)" title="暗夜星辰"></div>
    <div class="tmpl-dot t2" onclick="switchTemplate(1)" title="赤焰流光"></div>
    <div class="tmpl-dot t3" onclick="switchTemplate(2)" title="深蓝梦境"></div>
  </div>
  <div class="share-card-wrap" id="shareCardWrap"><div class="share-card" id="shareCard"></div></div>
  <div class="share-actions-bar">
    <button class="sc-btn primary" onclick="downloadCard()">📥 保存图片</button>
    <button class="sc-btn secondary" onclick="copyCaption()" id="copyCaptionBtn">📋 复制文案</button>
  </div>
  <div class="copy-caption-area" id="captionArea" style="display:none">
    <span class="copy-hint" onclick="copyCaption()">📋</span>
    <div id="captionText"></div>
  </div>
  <div class="social-proof">已有 <span class="count" id="shareCount">1,284</span> 人探索了命盘</div>
  <button class="sc-close" onclick="closeShare()" style="position:relative;top:auto;right:auto;margin-top:4px">关闭 ✕</button>
</div>

<!-- 粒子容器 -->
<div class="particles" id="particles"></div>

<script>
// ══════════════════════════════════════
// 全局状态
// ══════════════════════════════════════

async function searchCity(){
  const q=document.getElementById("city").value.trim();
  if(q.length<1){document.getElementById("cityList").classList.remove("show");return}
  try{const r=await fetch("/api/cities?q="+encodeURIComponent(q));const data=await r.json();
    const el=document.getElementById("cityList");
    el.innerHTML=data.length?data.map(c=>`<div class="city-item" onclick="selectCity('${c.city}')">${c.city} ${c.province} (${c.longitude.toFixed(2)},${c.latitude.toFixed(2)})</div>`).join(''):'<div class="city-item" style="color:var(--text-sub)">未找到城市</div>';
    el.classList.add("show")}catch(e){}
}
function selectCity(n){document.getElementById("city").value=n;document.getElementById("cityList").classList.remove("show")}
document.addEventListener('click',e=>{if(!e.target.closest('.city-wrap'))document.getElementById("cityList").classList.remove("show")});

const tips=['🌌 正在计算四柱八字...','⭐ 安放星曜中...','🔮 紫微定位完成...','📊 检测命盘格局...','✨ 生成专属解读...','🎭 计算人格原型...'];

async function loadChart(){
  const go=document.getElementById("go");go.disabled=true;go.textContent="排盘中...";
  const out=document.getElementById("out");
  let tipIdx=0;

  // 加载动画
  out.innerHTML=`<div class="loading-wrap"><div class="spinner"></div><div class="loading-tip" id="loadTip">🌌 正在连接星空...</div></div>`;
  const tipInterval=setInterval(()=>{
    document.getElementById("loadTip").textContent=tips[tipIdx%tips.length];tipIdx++;
  },800);

  try{
    const p={year:+document.getElementById("year").value,month:+document.getElementById("month").value,
      day:+document.getElementById("day").value,hour:+document.getElementById("hour").value,
      minute:+document.getElementById("min").value||0,name:document.getElementById("name").value||"",
      gender:document.getElementById("gender").value,city:document.getElementById("city").value||""};
    const q=new URLSearchParams(p).toString();
    const r=await fetch("/api/chart/full?"+q);
    if(!r.ok){const e=await r.json();throw new Error(e.detail||"排盘失败")}
    chartData=await r.json();
    analysisData=chartData.analysis||{};
    clearInterval(tipInterval);
    applyElementTheme();
    await revealAll();
    await updateShareCount();
  }catch(e){
    clearInterval(tipInterval);
    out.innerHTML=`<div class="panel"><div class="section-text" style="color:#e85d5d">排盘失败: ${e.message}</div></div>`
  }
  go.disabled=false;go.textContent="🔮 深度解读";
}

// ── 递进式揭秘 (SBIT风格) ──
async function revealAll(){
  const out=document.getElementById("out");
  const rar=analysisData.rarity||{};
  const dc=analysisData.destiny_code||{};

  // Step 0: 清屏
  out.innerHTML='';

  // Step 1: 稀有度英雄卡 (0.3s delay)
  await sleep(300);
  out.innerHTML=renderRarityHero();
  revealNext(out.firstElementChild);
  if(rar.tier==='SSR')spawnParticles(rar.color||'#ffd700');
  await sleep(800);

  // Step 2: 命码卡片
  out.innerHTML+=renderDestinyCode();
  revealNext(out.children[out.children.length-1]);
  await sleep(600);

  // Step 3: 五维雷达
  out.innerHTML+=renderRadar();
  revealNext(out.children[out.children.length-1]);
  setTimeout(()=>{
    document.querySelectorAll('.radar-bar').forEach(b=>{const w=b.dataset.width;b.style.width=w+'%'})
  },200);
  await sleep(800);

  // Step 4: Tab + 信息栏 + 命盘 (更快出内容)
  out.innerHTML+=renderShareBar();
  revealNext(out.children[out.children.length-1]);
  out.innerHTML+=renderTabs();
  revealNext(out.children[out.children.length-1]);
  out.innerHTML+=renderInfoBar();
  revealNext(out.children[out.children.length-1]);
  out.innerHTML+=renderSihuaRow();
  revealNext(out.children[out.children.length-1]);
  out.innerHTML+=renderTabContent();
  revealNext(out.children[out.children.length-1]);
}

function sleep(ms){return new Promise(r=>setTimeout(r,ms))}
function revealNext(el){if(!el)return;el.classList.add('reveal-step');requestAnimationFrame(()=>{el.classList.add('visible')})}

function spawnParticles(color){
  const container=document.getElementById('particles');
  const colors=[color,'#ffd700','#fbbf24','#f59e0b','#fff'];
  for(let i=0;i<60;i++){
    const p=document.createElement('div');p.className='particle';
    const size=Math.random()*8+4;
    p.style.cssText=`left:${Math.random()*100}%;top:${Math.random()*40}%;width:${size}px;height:${size}px;background:${colors[Math.floor(Math.random()*colors.length)]};--dx:${(Math.random()-0.5)*400}px;--dy:${Math.random()*500+200}px;animation-delay:${Math.random()*0.6}s`;
    container.appendChild(p);
    setTimeout(()=>p.remove(),3600);
  }
}

function applyElementTheme(){
  const theme=analysisData.element_theme||{};
  const root=document.documentElement.style;
  if(theme.primary)root.setProperty('--primary',theme.primary);
  if(theme.accent)root.setProperty('--accent',theme.accent);
  if(theme.glow)root.setProperty('--card-glow',theme.glow);
}

function renderRarityHero(){
  const rar=analysisData.rarity||{};if(!rar.tier)return '';
  const tierEmoji={SSR:'🌟',SR:'💎',R:'✨',UC:'🌿',C:'🌱'};
  const tiers=['C','UC','R','SR','SSR'];
  const activeIdx=tiers.indexOf(rar.tier);
  const tierDots=tiers.map((t,i)=>`<div class="tier-dot${i<=activeIdx?' active':''}"></div>`).join('');
  const bonuses=(rar.bonuses||[]).slice(0,5).map(b=>`<span class="bonus-tag">${b.desc}</span>`).join('');
  return `<div class="rarity-hero" style="--primary:${rar.color};--card-glow:${rar.glow};--card-bg:${rar.card_bg||'radial-gradient(ellipse at 50% 0%,rgba(212,168,83,.08),transparent 70%)'};">
    <div class="rarity-badge">${tierEmoji[rar.tier]||'✨'} ${rar.tier} · ${rar.tier_label}</div>
    <div class="rarity-score">${rar.score}<span class="rarity-score-unit">/1000</span></div>
    <div class="rarity-rank-text">${rar.rank_text}</div>
    <div class="rarity-percentile">百分位 ${rar.percentile}%</div>
    <div class="tier-icons">${tierDots}</div>
    ${bonuses?`<div class="bonus-list">${bonuses}</div>`:''}
  </div>`
}

function renderDestinyCode(){
  const dc=analysisData.destiny_code||{};if(!dc.code)return '';
  const theme=analysisData.element_theme||{};
  return `<div class="code-hero">
    <div class="code-emoji">${dc.emoji||'✨'}</div>
    <div class="code-name">${dc.full_name||'天命'}</div>
    <div class="code-tagline">「${dc.tagline||''}」</div>
    <div class="code-keywords">${(dc.keywords||[]).map(k=>`<span class="kw-tag">${k}</span>`).join('')}</div>
    ${theme.name?`<div style="margin-top:8px;font-size:.64em;color:var(--text-sub)">元素: ${theme.name} · ${theme.vibe||''}</div>`:''}
  </div>`
}

function renderRadar(){
  const dims=analysisData.dimensions||{};
  const order=['destiny','fortune','talent','heart','challenge'];
  const colors={destiny:'#c084fc',fortune:'#4ade80',talent:'#60a5fa',heart:'#f472b6',challenge:'#f97316'};
  let rows='';
  for(const key of order){
    const d=dims[key];if(!d)continue;
    rows+=`<div class="radar-row">
      <div class="radar-emoji">${d.emoji||''}</div><div class="radar-label">${d.name}</div>
      <div class="radar-bar-wrap"><div class="radar-bar" data-width="${d.score}" style="background:${colors[key]};width:0%"></div></div>
      <div class="radar-score">${d.score}</div>
    </div><div class="radar-desc">${d.label} · ${d.description||''}</div>`;
  }
  return `<div class="radar-card"><div class="radar-title">✦ 命格五维雷达 ✦</div>${rows}</div>`
}

function renderShareBar(){
  const rar=analysisData.rarity||{};
  const tierText=rar.tier?`我是${rar.tier}·${rar.tier_label}`:'';
  return `<div class="share-bar">
    <button class="share-btn primary-btn" onclick="openShare()">📸 生成分享卡片</button>
    <button class="share-btn secondary-btn" onclick="openShare()">📋 复制小红书文案</button>
  </div>`
}

function renderTabs(){
  const tabs=['overview','chart','personality','career','love','health','reading'];
  const labels={overview:'✨ 总览',chart:'🏰 命盘',personality:'🎭 性格',career:'💼 事业',love:'💕 感情',health:'💪 健康',reading:'📖 解读'};
  return `<div class="tabs">${tabs.map(t=>`<div class="tab${activeTab===t?' active':''}" onclick="switchTab('${t}',this)">${labels[t]}</div>`).join('')}</div>`
}

function switchTab(tab,el){
  document.querySelectorAll('.tab').forEach(t=>t.classList.remove('active'));
  el.classList.add('active');activeTab=tab;
  const out=document.getElementById("out");
  const behind=out.querySelector('.tab-panel-area')||(out.appendChild(document.createElement('div')));
  behind.className='tab-panel-area';
  const h=renderInfoBar()+renderSihuaRow()+(activeTab==='chart'?renderChart():'')+renderTabContent();
  behind.innerHTML=h;
  document.querySelectorAll('.reveal-step').forEach(el=>{el.classList.add('visible')});
}

function renderInfoBar(){
  const d=chartData;const fp=d.four_pillars||{};
  const items=[
    ['四柱八字',`${fp.year} ${fp.month} ${fp.day} ${fp.hour}`],
    ['命宫/身宫',`${d.ming_palace} / ${d.shen_palace}`],
    ['五行局',d.wuxing_ju],['生肖',d.zodiac],['农历',d.lunar_date],
    d.solar_correction?['真太阳时',`${d.solar_correction.corrected_hour}:${String(d.solar_correction.corrected_minute).padStart(2,'0')}`]:null,
  ].filter(Boolean);
  return `<div class="info-bar">${items.map(([l,v])=>`<div class="info-card"><div class="info-label">${l}</div><div class="info-value hl">${v}</div></div>`).join('')}</div>`
}

function renderSihuaRow(){
  const sihua=chartData.sihua||{};if(!Object.keys(sihua).length)return '';
  const cls={化禄:'si-lu',化权:'si-quan',化科:'si-ke',化忌:'si-ji'};
  return `<div class="sihua-row">${['化禄','化权','化科','化忌'].filter(t=>sihua[t]).map(t=>`<span class="si-tag ${cls[t]}">${t}: ${sihua[t]}</span>`).join('')}</div>`
}

function renderChart(){
  if(!chartData.palaces)return '';
  let cells='';
  for(const p of chartData.palaces){
    cells+=`<div class="palace${p.is_body?' body-palace':''}${selectedPalace===p.name?' selected':''}" onclick="selectPalace('${p.name}')">
      <div class="ph"><span class="pn">${p.name}</span><span class="pgz">${p.ganzhi}</span></div>
      <div class="ps">${p.stars.length?p.stars.map(s=>`<span class="star ${sc(s)}">${s}</span>`).join(''):'<span style="color:var(--text-sub);font-size:.58em">空宫</span>'}</div>
      ${p.is_body?'<div class="body-dot"></div>':''}${p.daxian?`<div class="dx-tag">📅 ${p.daxian}</div>`:''}
    </div>`;
  }
  return `<div class="chart-grid">${cells}</div>`
}

function selectPalace(name){
  selectedPalace=selectedPalace===name?null:name;switchTab(activeTab||'overview',document.querySelector('.tab.active')||document.querySelector('.tab'));
  if(selectedPalace){const p=chartData.palaces.find(x=>x.name===selectedPalace);if(p)showPalaceDetail(p)}
}

function showPalaceDetail(p){
  let el=document.getElementById('palace-detail');if(!el){el=document.createElement('div');el.id='palace-detail';document.querySelector('.tab-panel-area')?.prepend(el)}
  let h=`<div class="panel"><h3>${p.name} (${p.ganzhi}) ${p.is_body?'🏠 身宫':''}</h3>`;
  h+=`<div class="section-text">${p.stars.length?'星曜: '+p.stars.map(s=>`<span class="star ${sc(s)}">${s}</span>`).join(' '):'此宫无主星曜'}</div>`;
  if(p.sihua.length)h+=`<div style="font-size:.72em;color:var(--text-dim);margin-top:6px">四化: ${p.sihua.join(', ')}</div>`;
  const interp=analysisData.palace_interpretations||{};
  if(interp[p.name])h+=`<div style="margin-top:8px;padding-top:8px;border-top:1px solid var(--border);font-size:.74em;line-height:1.7">${interp[p.name]}</div>`;
  h+='</div>';el.innerHTML=h;el.scrollIntoView({behavior:'smooth',block:'center'});
}

function renderTabContent(){
  let h='<div id="palace-detail"></div>';
  const a=analysisData;
  if(activeTab==='overview'){
    h+=`<div class="panel"><h3>📋 命盘总览</h3><div class="section-text">${a.overview||''}</div></div>`;
    if(a.highlights&&a.highlights.length)h+=`<div class="panel"><h3>✨ 命盘亮点</h3>`+a.highlights.map(x=>`<div class="highlight-good">${x}</div>`).join('')+'</div>';
    if(a.cautions&&a.cautions.length)h+=`<div class="panel"><h3>⚠️ 注意事项</h3>`+a.cautions.map(x=>`<div class="highlight-warn">${x}</div>`).join('')+'</div>';
  }
  if(activeTab==='personality'){
    const pers=a.personality||{};const arch=a.archetype||{};
    h+=`<div class="panel"><h3>🎭 性格画像</h3><div class="section-text">${pers.summary||''}</div>`;
    if(pers.detail)h+=`<div class="section-text" style="color:var(--text-dim)">${pers.detail}</div>`;
    if(arch.description)h+=`<div class="section-text" style="margin-top:8px;padding:10px;background:var(--bg2);border-radius:8px">🏛️ <b>${arch.archetype_name||''}</b> — ${arch.tagline||''}<br><span style="color:var(--text-dim)">${arch.description||''}</span></div>`;
    h+='</div>';
  }
  if(activeTab==='career'){const cw=a.career_wealth||{};
    h+=`<div class="panel"><h3>💼 事业财运</h3><div class="section-text">${cw.career||''}</div>`;
    if(cw.wealth)h+=`<div class="section-text">💰 ${cw.wealth}</div>`;
    if(cw.wealth_tip)h+=`<div class="highlight-good">${cw.wealth_tip}</div>`;h+='</div>';
  }
  if(activeTab==='love'){const rel=a.relationship||{};
    h+=`<div class="panel"><h3>💕 感情婚姻</h3><div class="section-text">${rel.summary||'感情模式较受环境影响。'}</div>`;
    if(rel.detail)h+=`<div class="section-text" style="color:var(--text-dim)">${rel.detail}</div>`;h+='</div>';
  }
  if(activeTab==='health'){const hlth=a.health||{};
    h+=`<div class="panel"><h3>💪 健康分析</h3><div class="section-text">${hlth.summary||'整体健康运势平稳。'}</div>`;
    if(hlth.warning)h+=`<div class="highlight-warn">⚠️ ${hlth.warning}</div>`;h+='</div>';
  }
  if(activeTab==='reading'){h+=`<div class="panel" id="reading-content"><div class="section-text">解读生成中…</div></div>`;loadReadingTab();}
  return h;
}

async function loadReadingTab(){
  try{
    const p={year:+document.getElementById("year").value,month:+document.getElementById("month").value,
      day:+document.getElementById("day").value,hour:+document.getElementById("hour").value,
      minute:+document.getElementById("min").value||0,name:document.getElementById("name").value||"",
      gender:document.getElementById("gender").value,city:document.getElementById("city").value||"",mode:"full"};
    const q=new URLSearchParams(p).toString();
    const r=await fetch("/api/reading?"+q);
    if(!r.ok)throw new Error('error');
    const data=await r.json();const rd=data.reading||{};
    const text=rd.llm_reading||rd.local_reading||'暂无法生成解读';
    const note=rd.note?`<div style="font-size:.64em;color:var(--text-sub);margin-top:8px">${rd.note}</div>`:'';
    const el=document.getElementById('reading-content');if(el)el.innerHTML=`<div class="section-text">${text}</div>${note}`;
  }catch(e){const el=document.getElementById('reading-content');if(el)el.innerHTML=`<div style="color:#e85d5d;font-size:.78em">解读生成失败</div>`}
}

  const dc=analysisData.destiny_code||{};

  const tags=['#紫微斗数','#命盘解读','#性格测试','#你的专属命盘'];

  if(rar.rank_text)text+=`${rar.rank_text}\n`;
  text+=`\n${(dc.keywords||[]).join(' ')}\n\n`;

  const order=['destiny','fortune','talent','heart','challenge'];
  for(const key of order){const dm=dims[key];if(!dm)continue;text+=`${dm.emoji} ${dm.name}: ${dm.score}分 · ${dm.label}\n`;}

  text+='\n'+tags.join(' ')+'\n\n📸 截屏分享你的命盘！';

  const area=document.getElementById('captionArea');
  document.getElementById('captionText').textContent=text;
  area.style.display='block';

  navigator.clipboard.writeText(text).then(()=>{
    const btn=document.getElementById('copyCaptionBtn');
    btn.textContent='✅ 已复制';btn.classList.add('copied');
    setTimeout(()=>{btn.textContent='📋 复制文案';btn.classList.remove('copied')},1500);
  }).catch(()=>{});
}

async function updateShareCount(){
  const count=1284+Math.floor(Math.random()*50);
  document.getElementById('shareCount').textContent=count.toLocaleString();
}

document.addEventListener('DOMContentLoaded',()=>{
  document.getElementById('year').value=new Date().getFullYear();
  document.getElementById('shareOverlay').addEventListener('click',function(e){if(e.target===this)closeShare()});
  loadChart();
})
</script>
